name: pages

# Every push to main republishes the site. A push to dev, or a pull request, only
# validates, so a malformed paper entry fails there instead of reaching the public
# page.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel a running one. A half-finished deploy
# would leave the site serving nothing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # index.html is generated and not committed, so build it before the
      # tests that read it. The hub lives in paper-hub/; build.py resolves its
      # own paths, so it runs from the repo root.
      - run: python3 paper-hub/build.py
      - run: python3 .claude/skills/dev-test/tests/test_database.py

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A job-level permissions block replaces the workflow-level one instead of
    # merging with it, so contents: read has to be repeated here. Without it
    # checkout fails with "Repository not found" — on a private repo only, which
    # is why a public repo hides this.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
      # _site holds the page and the raw database. Nothing else in the repo
      # reaches the public site, which is what keeps build.py, serve.py and
      # .claude/ off it without deleting them from the repo.
      - run: python3 paper-hub/build.py --site _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

training":{"supervision":"Self-distillation with no labels, on an automatically curated 142M-image set (LVD-142M).","note":"The curation pipeline — retrieval from an uncurated pool against a curated seed — is as much the contribution as the objective."}},"method":{"intuition":"Self-supervision was not the bottleneck. Data curation was.","family":["ssl","transformer"],"backbone":"ViT-g/14, distilled to ViT-S/B/L","init":"scratch","components":["automatic data curation pipeline","iBOT + DINO objectives","training stabilization at scale","distillation to small models"]},"experiments":{"datasets":[{"name":"LVD-142M","role":"new"},{"name":"ImageNet, depth, segmentation, retrieval benchmarks","role":"existing"}],"metrics":["linear-probe accuracy","dense prediction quality"],"baselines":["OpenCLIP","prior SSL methods"],"headline":"Surpasses OpenCLIP on most image- and pixel-level benchmarks without any fine-tuning."},"why":"Sits under a large fraction of this list. Background reading rather than a physical AI paper in itself.","confidence":"high","tags":["foundation","self-supervised"],"_src":"01-world-models.json"},{"id":"vlamp","short":"VLaMP","title":"Pretrained Language Models as Visual Planners for Human Assistance","year":2023,"date":"2023-04","venue":"ICCV 2023","venue_type":"conference","authors":["Dhruvesh Patel","Hamid Eghbalzadeh","Nitin Kamra","Michael Louis Iuzzolino","Unnat Jain","Ruta Desai"],"n_authors":6,"institutions":["Meta AI","UMass Amherst"],"links":{"arxiv":"https://arxiv.org/abs/2304.09179"},"tldr":"Names the task: given a goal in words and video of how far the person got, output the remaining steps. Planning for a human, not for a gripper.","contribution":["method","benchmark"],"openness":["code","data","weights"],"arc":["change"],"closes_loop":false,"loop_stage":["represent","decide","act"],"embodiment":["human"],"human_role":["assisted"],"world_facet":["procedure"],"representation":["language","latent"],"change_channel":["language","plan"],"sensing":["egocentric","exocentric"],"regime":"offline","horizon":"minutes","domain":["everyday"],"autonomy":"human-in-loop","problem":{"task":"Visual Planning for Assistance (VPA): goal + progress video → the next actions the person should take.","inference":{"inputs":[{"name":"goal","modality":"text","tensor":"g","chars":"One short phrase — \"make a shelf\"."},{"name":"progress video","modality":"video","tensor":"V_{0:t}","chars":"Untrimmed, arbitrarily long, showing what has been done so far."}],"outputs":[{"name":"action plan","modality":"text","tensor":"(a_{t+1} .. a_{t+k})","chars":"An ordered sequence, evaluated by success rate and mean IoU against the ground-truth remainder."}]},"training":{"supervision":"Segment labels for the observed part, action sequences for the plan.","note":"Decomposing into segmentation then forecasting is what lets a pretrained LM be dropped into the second half."}},"method":{"intuition":"Forecasting the rest of a procedure is sequence modeling over actions, which is exactly what a pretrained language model is already good at.","family":["llm","transformer"],"backbone":"video segmentation model + pretrained LM","init":"finetune","components":["VPA task formulation","video action segmentation front end","multimodal sequence forecasting with an LM","ablations isolating language pretraining, visual input and goal"]},"experiments":{"datasets":[{"name":"CrossTask","role":"existing"},{"name":"COIN","role":"existing"}],"metrics":["success rate","mean accuracy","mean IoU"],"baselines":["procedure planning models","no-goal and no-vision ablations"],"headline":"Outperforms baselines across plan-quality metrics. Ablations show language pretraining, visual observation and the goal each carry independent weight."},"why":"The task definition the human-assistance branch has been iterating on ever since.","confidence":"high","tags":["task guidance","planning","LLM"],"_src":"05-human-embodiment.json"},{"id":"act-aloha","short":"ACT / ALOHA","title":"Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware","year":2023,"date":"2023-04","venue":"RSS 2023","venue_type":"conference","authors":["Tony Z. Zhao","Vikash Kumar","Sergey Levine","Chelsea Finn"],"n_authors":4,"institutions":["Stanford University","UC Berkeley","Meta"],"links":{"arxiv":"https://arxiv.org/abs/2304.13705","page":"https://tonyzhaozh.github.io/aloha/"},"tldr":"Action chunking absorbs compounding error, which is why low-cost imprecise hardware can slot a battery with ten minutes of demonstrations.","contribution":["method","system"],"openness":["code","data"],"arc":["change"],"closes_loop":true,"loop_stage":["sense","decide","act"],"embodiment":["robot","human+robot"],"human_role":["demonstrator"],"world_facet":["agent-body","interaction"],"representation":["trajectory"],"change_channel":["motor-action"],"sensing":["robot-onboard"],"regime":"streaming","horizon":"seconds","domain":["lab-sim"],"autonomy":"autonomous","problem":{"task":"End-to-end bimanual imitation learning from teleoperated demonstrations on low-cost arms.","inference":{"inputs":[{"name":"multi-camera images + joint positions","modality":"image","tensor":"(I^{1..4}, q) ","chars":"No depth, no calibration, no force sensing."}],"outputs":[{"name":"action chunk","modality":"action","tensor":"a_{t:t+k} ∈ R^{k×14}","chars":"14-DoF bimanual joint targets, temporally ensembled across overlapping chunks."}]},"training":{"supervision":"Behavior cloning from about 10 minutes of demonstrations per task, collected through a custom teleoperation rig.","note":"The CVAE latent absorbs demonstrator non-stationarity, which is the other half of why so little data suffices."}},"method":{"intuition":"Errors compound because the policy re-decides every timestep. Committing to a chunk of actions cuts the effective horizon by an order of magnitude.","family":["transformer","imitation"],"backbone":"transformer CVAE","init":"scratch","components":["action chunking","temporal ensembling","CVAE over demonstration style","low-cost bimanual teleoperation hardware"]},"experiments":{"datasets":[{"name":"6 real fine-manipulation tasks","role":"real-robot"}],"metrics":["task success rate"],"baselines":["BC-ConvMLP","BeT","RT-1","VINN"],"headline":"80–90% success on tasks like opening a translucent condiment cup and slotting a battery, from 10 minutes of demonstrations each."},"why":"Made dexterous imitation reproducible outside well-funded labs, which is why so much of the field's data now exists.","confidence":"high","tags":["imitation","bimanual","hardware"],"_src":"07-robot-embodiment.json"},{"id":"vrb","short":"VRB","title":"Affordances from Human Videos as a Versatile Representation for Robotics","year":2023,"date":"2023-04","venue":"CVPR 2023","venue_type":"conference","authors":["Shikhar Bahl","Russell Mendonca","Lili Chen","Unnat Jain","Deepak Pathak"],"n_authors":5,"institutions":["CMU"],"links":{"arxiv":"https://arxiv.org/abs/2304.08488","page":"https://robo-affordances.github.io/"},"tldr":"Predict where and how a human would interact from internet video, and that single affordance map slots into imitation, exploration, goal-conditioned learning and RL alike.","contribution":["method"],"openness":["code"],"arc":["model","change"],"closes_loop":true,"loop_stage":["represent","decide","act"],"embodiment":["robot"],"human_role":["demonstrator"],"world_facet":["interaction","object-state","scene"],"representation":["trajectory","latent"],"change_channel":["motor-action","plan"],"sensing":["web-video","robot-onboard","egocentric"],"regime":"streaming","horizon":"seconds","domain":["everyday","web"],"autonomy":"autonomous","problem":{"task":"Learn a visual affordance model from human video and use it as the interface to four different robot learning paradigms.","inference":{"inputs":[{"name":"scene image","modality":"image","tensor":"x ∈ R^{H×W×3}","chars":"From the robot's camera, in unmodified real environments."}],"outputs":[{"name":"contact point","modality":"mask","tensor":"c ∈ R^{2}","chars":"Where a human would touch."},{"name":"post-contact trajectory","modality":"trajectory","tensor":"τ ∈ R^{k×2}","chars":"How the interaction would proceed, which is the half a contact point alone leaves out."}]},"training":{"supervision":"Human hand trajectories extracted from internet videos of people acting in environments.","note":"Environment-centric rather than hand-centric framing is what makes the output usable by a robot with different kinematics."}},"method":{"intuition":"Human video cannot be imitated joint-for-joint, but the where-and-how of interaction transfers, and that is enough to seed four kinds of robot learning.","family":["cnn","imitation","rl"],"backbone":"affordance prediction network","init":"finetune","components":["contact point and post-contact trajectory prediction","integration with offline imitation, exploration, goal-conditioned learning and RL"]},"experiments":{"datasets":[{"name":"internet human interaction video","role":"existing"},{"name":"4 real environments, 10+ tasks, 2 platforms","role":"real-robot"}],"metrics":["task success","sample efficiency"],"baselines":["visual representation pretraining (R3M, MVP)","no-affordance variants"],"headline":"Effective across 4 real-world environments, over 10 tasks and 2 robot platforms operating in the wild."},"why":"The cleanest formulation of what transfers from human video to robot action: the affordance rather than the motion.","confidence":"high","tags":["affordance","human video","transfer"],"_src":"08-human-to-robot-and-together.json"},{"id":"diffusion-policy","short":"Diffusion Policy","title":"Diffusion Policy: Visuomotor Policy Learning via Action Diffusion","year":2023,"date":"2023-03","venue":"RSS 2023","venue_type":"conference","authors":["Cheng Chi","Zhenjia Xu","Siyuan Feng","Eric Cousineau","Yilun Du","Shuran Song"],"n_authors":8,"institutions":["Columbia University","Toyota Research Institute","MIT"],"links":{"arxiv":"https://arxiv.org/abs/2303.04137","page":"https://diffusion-policy.cs.columbia.edu"},"tldr":"Human demonstrations are multimodal, because there are several right ways to do a task. A denoising diffusion policy keeps that where a regression head averages it away.","contribution":["method"],"openness":["code","data","weights"],"arc":["change"],"closes_loop":true,"loop_stage":["sense","decide","act"],"embodiment":["robot"],"human_role":["demonstrator"],"world_facet":["agent-body","object-state"],"representation":["trajectory"],"change_channel":["motor-action"],"sensing":["robot-onboard"],"regime":"streaming","horizon":"seconds","domain":["lab-sim"],"autonomy":"autonomous","problem":{"task":"Visuomotor imitation: observations to a chunk of future actions.","inference":{"inputs":[{"name":"observation history","modality":"image","tensor":"o_{t-h:t}","chars":"A short window of camera frames plus proprioception."}],"outputs":[{"name":"action chunk","modality":"trajectory","tensor":"a_{t:t+T_a} ∈ R^{T_a×d}","chars":"Denoised over K Langevin steps; executed under receding horizon control."}]},"training":{"supervision":"Behavior cloning from human teleoperated demonstrations.","note":"Predicting a chunk rather than a single action is what gives temporal consistency. The diffusion head is what preserves multimodality."}},"method":{"intuition":"Learn the gradient of the action distribution rather than its mean, and the policy stops collapsing between valid strategies.","family":["diffusion","transformer"],"backbone":"CNN or time-series diffusion transformer","init":"scratch","components":["conditional denoising over action sequences","receding horizon control","visual conditioning","time-series diffusion transformer"]},"experiments":{"datasets":[{"name":"12 tasks across 4 manipulation benchmarks","role":"existing"},{"name":"real robot tasks","role":"real-robot"}],"metrics":["task success rate"],"baselines":["LSTM-GMM","IBC","BET"],"headline":"Average 46.9% improvement over prior state-of-the-art across 12 tasks and 4 benchmarks."},"why":"The action representation that reset robot imitation learning, and the head that most later VLAs adopted.","confidence":"high","tags":["imitation","diffusion","manipulation"],"_src":"07-robot-embodiment.json"},{"id":"react","short":"ReAct","title":"ReAct: Synergizing Reasoning and Acting in Language Models","year":2022,"date":"2022-10","venue":"ICLR 2023","venue_type":"conference","authors":["Shunyu Yao","Jeffrey Zhao","Dian Yu","Nan Du","Izhak Shafran","Karthik Narasimhan","Yuan Cao"],"n_authors":7,"institutions":["Princeton University","Google"],"links":{"arxiv":"https://arxiv.org/abs/2210.03629","page":"https://react-lm.github.io/"},"tldr":"Interleave a thought and an action in the same token stream, feed the observation back in, repeat. The loop pattern almost every embodied agent now uses.","contribution":["method"],"openness":["code"],"arc":["change"],"closes_loop":true,"loop_stage":["decide","act","verify","adapt"],"embodiment":["none","sim"],"human_role":["none"],"world_facet":["procedure"],"representation":["language"],"change_channel":["plan"],"sensing":["sim-render"],"regime":"interactive","horizon":"minutes","domain":["lab-sim","web"],"autonomy":"autonomous","problem":{"task":"Interleaved reasoning and acting in a text-based environment loop.","inference":{"inputs":[{"name":"task","modality":"text","tensor":"ℓ","chars":""},{"name":"observation","modality":"text","tensor":"o_t","chars":"Returned by the environment after each action and appended to the context."}],"outputs":[{"name":"thought","modality":"text","tensor":"τ_t","chars":"Free-form reasoning that updates the plan without touching the world."},{"name":"action","modality":"text","tensor":"a_t","chars":"An API or environment call."}]},"training":{"supervision":"Few-shot prompting. No training.","note":"Reasoning-only hallucinates because nothing corrects it. Acting-only cannot revise because it never reflects. The interleaving is the whole contribution."}},"method":{"intuition":"Thinking without acting drifts from reality and acting without thinking cannot recover from a mistake, so alternate them in one stream.","family":["llm","prompting"],"backbone":"PaLM-540B / GPT-3","init":"prompt-only","components":["thought-action-observation loop","external tool calls","trajectory as prompt context"]},"experiments":{"datasets":[{"name":"HotpotQA, FEVER (with a Wikipedia API)","role":"existing"},{"name":"ALFWorld, WebShop","role":"existing"}],"metrics":["exact match","success rate"],"baselines":["chain-of-thought only","act-only"],"headline":"+34% absolute success on ALFWorld and +10% on WebShop over imitation and reinforcement learning baselines, with fewer hallucinations than reasoning-only prompting."},"why":"The loop this list is organized around, written down in its most compressed form, and the reason to ask why physical loops rarely look this clean.","confidence":"high","tags":["agent","closed loop","LLM"],"_src":"08-human-to-robot-and-together.json"},{"id":"code-as-policies","short":"Code as Policies","title":"Code as Policies: Language Model Programs for Embodied Control","year":2022,"date":"2022-09","venue":"ICRA 2023","venue_type":"conference","authors":["Jacky Liang","Wenlong Huang","Fei Xia","Peng Xu","Karol Hausman","Andy Zeng"],"n_authors":8,"institutions":["Google"],"links":{"arxiv":"https://arxiv.org/abs/2209.07753"},"tldr":"The policy is a Python program the LLM writes, so control flow, arithmetic and third-party libraries come for free.","contribution":["method"],"openness":["code"],"arc":["change"],"closes_loop":true,"loop_stage":["decide","act"],"embodiment":["robot"],"human_role":["none"],"world_facet":["object-state","scene","procedure"],"representation":["program","language"],"change_channel":["plan","motor-action"],"sensing":["robot-onboard"],"regime":"interactive","horizon":"minutes","domain":["lab-sim","everyday"],"autonomy":"autonomous","problem":{"task":"Turn a natural-language command into executable robot policy code.","inference":{"inputs":[{"name":"command","modality":"text","tensor":"ℓ","chars":"Includes vague terms — \"faster\", \"a bit to the left\"."},{"name":"API surface","modality":"program","tensor":"perception + control primitives","chars":"Object detectors and control APIs, exposed as callable functions."}],"outputs":[{"name":"policy program","modality":"program","tensor":"P","chars":"Python: loops, conditionals, NumPy and Shapely calls, waypoints."}]},"training":{"supervision":"Few-shot prompting only.","note":"Hierarchical code-gen — recursively defining undefined functions — is what lets one prompt cover a long tail of commands."}},"method":{"intuition":"Robot policies already look like programs, so the natural output format for a code-trained LLM is the policy itself rather than a plan to be interpreted.","family":["llm","prompting"],"backbone":"code-completion LLM","init":"prompt-only","components":["language model programs","hierarchical code generation","perception and control APIs as first-class functions"]},"experiments":{"datasets":[{"name":"multiple real robot platforms and tabletop tasks","role":"real-robot"}],"metrics":["command success rate","generalization to novel instructions"],"baselines":["natural-language plan decoding"],"headline":"Spatial-geometric reasoning, generalization to unseen instructions, and precise values assigned to vague terms from context."},"why":"The symbolic branch of robot decision-making: the plan is a program, so it can be inspected, composed and debugged.","confidence":"high","tags":["LLM","program synthesis","control"],"_src":"07-robot-embodiment.json"},{"id":"inner-monologue","short":"Inner Monologue","title":"Inner Monologue: Embodied Reasoning through Planning with Language Models","year":2022,"date":"2022-07","venue":"CoRL 2022","venue_type":"conference","authors":["Wenlong Huang","Fei Xia","Ted Xiao","Harris Chan","Jacky Liang","Pete Florence"],"n_authors":17,"institutions":["Google","Stanford University"],"links":{"arxiv":"https://arxiv.org/abs/2207.05608","page":"https://innermonologue.github.io"},"tldr":"Feed the outcome back to the planner as text: success detection, scene description, a person's correction. Closed-loop replanning falls out with no extra training.","contribution":["method"],"openness":["none"],"arc":["change"],"closes_loop":true,"loop_stage":["decide","act","verify","adapt"],"embodiment":["robot","human+robot"],"human_role":["collaborator"],"world_facet":["procedure","object-state"],"representation":["language"],"change_channel":["plan","motor-action"],"sensing":["robot-onboard"],"regime":"interactive","horizon":"minutes","domain":["everyday","lab-sim"],"autonomy":"mixed-initiative","problem":{"task":"Closed-loop language planning where environment and human feedback re-enter the prompt.","inference":{"inputs":[{"name":"instruction","modality":"text","tensor":"ℓ","chars":""},{"name":"feedback","modality":"text","tensor":"f_t","chars":"Success detector output, scene description, or a person saying \"no, the other one\" — all as text."}],"outputs":[{"name":"next skill","modality":"text","tensor":"π_t","chars":"Replanned after every observation."}]},"training":{"supervision":"None — the LLM is frozen and everything happens in the prompt.","note":"Turning heterogeneous feedback into a single text channel is the trick that makes closed-loop control prompt-shaped."}},"method":{"intuition":"If every kind of feedback is rendered as language, the planner needs no new machinery to close the loop. It just keeps reading.","family":["llm"],"backbone":"frozen LLM + perception modules","init":"prompt-only","components":["success detection feedback","passive scene description","active human interaction","text-formatted inner monologue"]},"experiments":{"datasets":[{"name":"simulated tabletop rearrangement","role":"synthetic"},{"name":"real tabletop and kitchen mobile manipulation","role":"real-robot"}],"metrics":["instruction completion rate"],"baselines":["open-loop LLM planning"],"headline":"Closed-loop language feedback significantly improves high-level instruction completion in three domains, including real-world long-horizon mobile manipulation."},"why":"The reference implementation of closing the loop through language — the pattern most agent systems on this list inherit.","confidence":"high","tags":["closed loop","LLM","feedback"],"_src":"07-robot-embodiment.json"},{"id":"saycan","short":"SayCan","title":"Do As I Can, Not As I Say: Grounding Language in Robotic Affordances","year":2022,"date":"2022-04","venue":"CoRL 2022","venue_type":"conference","authors":["Michael Ahn","Anthony Brohan","Noah Brown","Yevgen Chebotar","Karol Hausman","Brian Ichter"],"n_authors":45,"institutions":["Google","Everyday Robots"],"links":{"arxiv":"https://arxiv.org/abs/2204.01691","page":"https://say-can.github.io/"},"tldr":"An LLM knows how to clean a spill but not whether this robot can. Multiply the language score by a learned value function and you get a plan the body can execute.","contribution":["method"],"openness":["none"],"arc":["change"],"closes_loop":true,"loop_stage":["decide","act"],"embodiment":["robot"],"human_role":["none"],"world_facet":["procedure","object-state"],"representation":["language"],"change_channel":["plan","motor-action"],"sensing":["robot-onboard"],"regime":"interactive","horizon":"minutes","domain":["everyday"],"autonomy":"autonomous","problem":{"task":"Execute a long-horizon natural-language instruction by selecting a sequence of learned skills.","inference":{"inputs":[{"name":"instruction","modality":"text","tensor":"ℓ","chars":"High-level and temporally extended: \"I spilled my drink, can you help?\""},{"name":"observation","modality":"image","tensor":"o_t","chars":"Robot camera, used by the value functions."}],"outputs":[{"name":"next skill","modality":"text","tensor":"π_t","chars":"Argmax of p_LLM(skill | ℓ) × p_affordance(success | o_t, skill)."}]},"training":{"supervision":"Skill policies and ole":["observed"],"world_facet":["procedure","agent-body","object-state"],"representation":["pixels","geometry"],"change_channel":["none"],"sensing":["egocentric","exocentric","multi-view"],"regime":"offline","horizon":"minutes","domain":["industrial","everyday"],"autonomy":"none","problem":{"task":"Action recognition, anticipation, temporal segmentation, and the newly proposed mistake detection.","inference":{"inputs":[{"name":"multi-view video","modality":"video","tensor":"(V_static^{1..8}, V_ego^{1..4})","chars":"8 static plus 4 egocentric cameras, simultaneous — the first dataset with both."}],"outputs":[{"name":"action segments","modality":"label","tensor":"{(t_s, t_e, a)}","chars":"100K coarse and 1M fine-grained segments."},{"name":"mistake flag","modality":"label","tensor":"m ∈ {0,1}","chars":"Ordering errors and corrections, occurring naturally because participants had no script."}]},"training":{"supervision":"Manual action segments plus 18M 3D hand poses.","note":"Generalization to unseen toys is an explicit split, which is rarer than it should be."}},"method":{"intuition":"If you hand people instructions you get clean data and no errors. Taking the instructions away is what produces a mistake dataset.","family":["dataset"],"backbone":"","init":"","components":["4,321 videos / 101 toy vehicles","8 static + 4 egocentric views","18M 3D hand poses","mistake detection task"]},"experiments":{"datasets":[{"name":"Assembly101","role":"new"}],"metrics":["accuracy","edit score","F1@k","mistake detection AUC"],"baselines":["temporal segmentation and recognition models, pose vs. appearance"],"headline":"Benchmarks across three tasks plus mistake detection, with cross-view and unseen-toy generalization studies."},"why":"The origin point for procedural mistake detection, and still the most-used evaluation for it.","confidence":"high","tags":["procedural","mistakes","dataset","multi-view"],"_src":"03-egocentric-procedural-data.json"},{"id":"ego4d","short":"Ego4D","title":"Ego4D: Around the World in 3,000 Hours of Egocentric Video","year":2021,"date":"2021-10","venue":"CVPR 2022","venue_type":"conference","authors":["Kristen Grauman","Andrew Westbury","Eugene Byrne","Zachary Chavis","Antonino Furnari","Jitendra Malik"],"n_authors":85,"institutions":["Meta AI","UT Austin","Ego4D consortium (13 universities)"],"links":{"arxiv":"https://arxiv.org/abs/2110.07058","page":"https://ego4d-data.org/"},"tldr":"3,670 hours of unscripted first-person life from 931 wearers in 9 countries, with a benchmark suite split by tense: past, present, future.","contribution":["dataset","benchmark"],"openness":["data","code"],"arc":["model"],"closes_loop":false,"loop_stage":["sense","represent","anticipate"],"embodiment":["human"],"human_role":["observed"],"world_facet":["agent-body","object-state","interaction","procedure"],"representation":["pixels","language"],"change_channel":["none"],"sensing":["egocentric","audio","gaze","imu-wearable","depth-3d","multi-view"],"regime":"offline","horizon":"hours","domain":["everyday"],"autonomy":"none","problem":{"task":"A benchmark suite over first-person video: episodic memory (past), hand-object and social interaction (present), forecasting (future).","inference":{"inputs":[{"name":"egocentric video","modality":"video","tensor":"V ∈ R^{T×H×W×3}","chars":"Unscripted daily life, minutes to hours, hundreds of scenarios."},{"name":"side channels","modality":"imu","tensor":"audio, IMU, gaze, stereo, 3D mesh","chars":"Present on subsets, not everywhere — a practical constraint people underestimate."}],"outputs":[{"name":"per-benchmark labels","modality":"label","tensor":"varies","chars":"Query response windows, hand-object state changes, future actions."}]},"training":{"supervision":"Dense narrations plus benchmark-specific annotations.","note":"Collection was designed around consent and de-identification, which is part of why it exists at this scale at all."}},"method":{"intuition":"First-person video is a different distribution from web video — motion blur, out-of-frame hands, no editing — and the field could not study it without a corpus of this size.","family":["dataset"],"backbone":"","init":"","components":["3,670 h / 931 wearers / 74 locations","dense timestamped narrations","five benchmark tracks"]},"experiments":{"datasets":[{"name":"Ego4D","role":"new"}],"metrics":["per-track: recall, mAP, edit distance, success"],"baselines":["adapted third-person video models"],"headline":"Baselines across five tracks, most of them far from usable, which is the point of releasing it."},"why":"The dataset that made the human-embodiment branch of physical AI a field rather than a handful of lab captures.","confidence":"high","tags":["egocentric","dataset","benchmark"],"_src":"03-egocentric-procedural-data.json"},{"id":"narrated-videos-3d","short":"Narrated Videos in 3D","title":"Reconstructing and grounding narrated instructional videos in 3D","year":2021,"date":"2021-09","venue":"NeurIPS 2021","venue_type":"conference","authors":["Dimitri Zhukov","Ignacio Rocco","Ivan Laptev","Josef Sivic","Johannes L. Schönberger","Bugra Tekin"],"n_authors":7,"institutions":["Inria","Czech Technical University","Microsoft"],"links":{"arxiv":"https://arxiv.org/abs/2109.04409"},"tldr":"Different YouTube videos of the same car engine are different instances of one object. Reconstruct it across videos and the narration lands on a 3D part.","contribution":["method"],"openness":["none"],"arc":["model"],"closes_loop":false,"loop_stage":["sense","represent"],"human_role":["observed"],"embodiment":["none"],"world_facet":["scene","object-state","procedure"],"representation":["geometry","language"],"change_channel":["none"],"sensing":["exocentric","web-video"],"regime":"offline","horizon":"minutes","domain":["industrial","web"],"autonomy":"none","problem":{"task":"Reconstruct an object class in 3D from many unaligned instructional videos, then ground the narration to it.","inference":{"inputs":[{"name":"instructional videos","modality":"video","tensor":"{V_i}","chars":"Different products, lighting and versions of the same object — the reason instance-level SfM fails."},{"name":"narration","modality":"text","tensor":"{n_i}","chars":"Free speech, wide variation in phrasing."}],"outputs":[{"name":"3D reconstruction","modality":"pointcloud","tensor":"P","chars":"Aligned across videos through a 3D alignment graph."},{"name":"grounded narration","modality":"mask","tensor":"n → region(P)","chars":"Unsupervised."}]},"training":{"supervision":"None. Raw videos, no manual annotation.","note":"Divide-and-conquer: reconstruct per video first, then align the reconstructions."}},"method":{"intuition":"Instructional video is a giant uncalibrated multi-view capture of the world's objects, if you can match across instances rather than across frames.","family":["classical","cnn"],"backbone":"learnt local features + dense flow + SfM","init":"frozen-foundation","components":["cross-instance correspondence estimation","two-step reconstruction with a 3D alignment graph","unsupervised language grounding in 3D"]},"experiments":{"datasets":[{"name":"car maintenance instructional videos","role":"existing"}],"metrics":["reconstruction quality","grounding accuracy"],"baselines":["instance-level SfM"],"headline":"Reconstructs engines of different car models from raw video with no manual supervision and associates the narration with 3D regions."},"why":"An early and still-underused idea: instructional video is 3D data about the physical world, on top of being a sequence of steps.","confidence":"high","tags":["3D","instructional video","grounding"],"_src":"09-scenes-4d-physics-checks.json"},{"id":"epic-kitchens-100","short":"EPIC-KITCHENS-100","title":"Rescaling Egocentric Vision: Collection, Pipeline and Challenges for EPIC-KITCHENS-100","year":2020,"date":"2020-06","venue":"IJCV 2022","venue_type":"journal","authors":["Dima Damen","Hazel Doughty","Giovanni Maria Farinella","Antonino Furnari","Evangelo ction rather than a discrete grid, and the resolution limit goes away.","family":["nerf-3dgs"],"backbone":"fully-connected MLP","init":"scratch","components":["5D radiance field","positional encoding","hierarchical volume sampling"]},"experiments":{"datasets":[{"name":"synthetic and real forward-facing scenes","role":"new"}],"metrics":["PSNR / SSIM / LPIPS"],"baselines":["neural volumes","local light field fusion","scene representation networks"],"headline":"Outperformed prior neural rendering on complex geometry and view-dependent appearance."},"why":"Historical anchor for how the field learned to hold 3D scenes in a differentiable form.","confidence":"high","tags":["3D","rendering","foundation"],"_src":"02-objects-scenes-physics.json"},{"id":"action-genome","short":"Action Genome","title":"Action Genome: Actions as Composition of Spatio-temporal Scene Graphs","year":2019,"date":"2019-12","venue":"CVPR 2020","venue_type":"conference","authors":["Jingwei Ji","Ranjay Krishna","Li Fei-Fei","Juan Carlos Niebles"],"n_authors":4,"institutions":["Stanford University"],"links":{"arxiv":"https://arxiv.org/abs/1912.06992"},"tldr":"An action is a sequence of changing object relationships. Annotating those relationships gives few-shot recognition for free.","contribution":["dataset","method"],"openness":["data"],"arc":["model"],"closes_loop":false,"loop_stage":["represent"],"embodiment":["none"],"human_role":["observed"],"world_facet":["object-state","object-change","interaction"],"representation":["graph"],"change_channel":["none"],"sensing":["exocentric"],"regime":"offline","horizon":"seconds","domain":["everyday"],"autonomy":"none","problem":{"task":"Decompose actions into spatio-temporal scene graphs, and predict those graphs from video.","inference":{"inputs":[{"name":"video","modality":"video","tensor":"V ∈ R^{T×H×W×3}","chars":"10K videos of daily activity."}],"outputs":[{"name":"scene graph per frame","modality":"graph","tensor":"G_t","chars":"0.4M objects, 1.7M visual e.","confidence":"high","tags":["task graph","imitation","compositional"],"_src":"04-procedure-structure.json"}]}</script>
<script>
(function(){
"use strict";
const DB = JSON.parse(document.getElementById('db').textContent);
const S = DB.schema, P = DB.papers;
const $ = s => document.querySelector(s);
const el = (t,c,h) => { const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n; };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Every block a reader can point at carries a stable id. Comment anchors resolve by
// id first, so ids are what keep comments attached when a filter redraws the page.
const slugId = v => String(v).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'x';

/* ---------- vocab lookup ---------- */
const F = {}; S.fields.forEach(f=>F[f.key]=f);
const LBL = {};
S.fields.forEach(f=>{ LBL[f.key]={}; (f.vocab||[]).forEach(v=>LBL[f.key][v.v]=v.label); });
const label = (k,v)=> (LBL[k]&&LBL[k][v]) || v;
const arr = v => v==null?[]:(Array.isArray(v)?v:[v]);
const LOOP = (F.loop_stage.vocab||[]).map(v=>v.v);

/* ---------- search index ---------- */
P.forEach(p=>{
  p._blob = [p.title,p.short,p.tldr,p.why,(p.authors||[]).join(' '),(p.institutions||[]).join(' '),
    p.venue,(p.tags||[]).join(' '),p.method&&p.method.intuition,p.problem&&p.problem.task,
    p.experiments&&p.experiments.headline,(p.method&&p.method.family||[]).join(' '),
    (p.experiments&&p.experiments.datasets||[]).map(d=>d.name).join(' '),
    S.fields.filter(f=>f.facet&&f.kind!=='bool').map(f=>arr(p[f.key]).map(v=>label(f.key,v)).join(' ')).join(' ')
  ].filter(Boolean).join(' \u2022 ').toLowerCase();
});

/* ---------- state ---------- */
const VIEWS = ['framework','table','protocol'];
const state = {
  view:'framework', q:'',
  filters:{},            // key -> Set(values)
  sort:{key:'date',dir:-1},
  cols:['title','date','venue','arc','embodiment','loop_stage','world_facet','representation','contribution'],
  dedupe:true, showcols:false
};

const FACET_KEYS = S.fields.filter(f=>f.facet).map(f=>f.key);
FACET_KEYS.forEach(k=>state.filters[k]=new Set());

function facetValues(key){
  const f=F[key];
  if(f && f.kind==='bool') return ['true','false'];
  if(f && f.vocab) return f.vocab.map(v=>v.v);
  const s=new Set(); P.forEach(p=>arr(p[key]).forEach(v=>{ if(v!=null&&v!=='') s.add(String(v)); }));
  return [...s].sort((a,b)=> key==='year'? b-a : String(a).localeCompare(String(b)));
}
function pv(p,key){
  const f=F[key];
  if(f&&f.kind==='bool') return [String(!!p[key])];
  return arr(p[key]).map(String);
}
function passesExcept(p, skipKey){
  for(const k of FACET_KEYS){
    if(k===skipKey) continue;
    const sel=state.filters[k]; if(!sel.size) continue;
    const vals=pv(p,k);
    if(!vals.some(v=>sel.has(v))) return false;
  }
  if(state.q){
    const toks=state.q.toLowerCase().split(/\s+/).filter(Boolean);
    if(!toks.every(t=>p._blob.includes(t))) return false;
  }
  return true;
}
const matches = p => passesExcept(p,null);
function filtered(){ return P.filter(matches); }

/* ---------- facets UI ---------- */
function renderFacets(){
  const host=$('#facets'); const open=new Set([...host.querySelectorAll('details[open]')].map(d=>d.dataset.k));
  if(!host.dataset.init){ FACET_KEYS.forEach(k=>{ if(['arc','embodiment','loop_stage','contribution'].includes(k)) open.add(k); }); host.dataset.init='1'; }
  host.innerHTML='';
  FACET_KEYS.forEach(key=>{
    const f=F[key];
    const pool=P.filter(p=>passesExcept(p,key));
    const counts={}; pool.forEach(p=>pv(p,key).forEach(v=>counts[v]=(counts[v]||0)+1));
    const vals=facetValues(key).filter(v=>counts[v]||state.filters[key].has(String(v)));
    if(!vals.length) return;
    const d=el('details','facet'); d.dataset.k=key; d.id='facet-'+slugId(key);
    if(open.has(key)||state.filters[key].size) d.open=true;
    const sel=state.filters[key].size;
    d.appendChild(el('summary',null,
      `<span class="caret">▶</span>${esc(f?f.label:key)}<span class="n">${sel?sel+' ✓':vals.length}</span>`));
    const box=el('div','opts');
    vals.forEach(v=>{
      const on=state.filters[key].has(String(v));
      const vo=(f&&f.vocab||[]).find(x=>x.v===v);
      const help=vo&&vo.help?vo.help:'';
      const lab=el('label','opt'+(on?' on':''));
      lab.id='opt-'+slugId(key)+'-'+slugId(v);
      if(help) lab.dataset.help='1';
      lab.innerHTML=`<input type="checkbox" ${on?'checked':''}><span>${esc(label(key,v))}</span>`+
        `<span class="cnt">${counts[v]||0}</span>`+(help?`<span class="tip">${esc(help)}</span>`:'');
      lab.querySelector('input').addEventListener('change',e=>{
        const S_=state.filters[key]; e.target.checked?S_.add(String(v)):S_.delete(String(v)); render();
      });
      box.appendChild(lab);
    });
    d.appendChild(box); host.appendChild(d);
  });
}
$('#clearall').onclick=()=>{ FACET_KEYS.forEach(k=>state.filters[k].clear()); state.q=''; $('#q').value=''; render(); };

/* ---------- active chips ---------- */
function activeChips(){
  const wrap=el('div','chips'); let any=false;
  FACET_KEYS.forEach(k=>state.filters[k].forEach(v=>{
    any=true;
    const c=el('span','chip r',`<b>${esc(F[k]?F[k].label:k)}</b> ${esc(label(k,v))}`);
    const b=el('button',null,'×'); b.onclick=()=>{state.filters[k].delete(v);render();};
    c.appendChild(b); wrap.appendChild(c);
  }));
  if(state.q){ any=true;
    const c=el('span','chip r',`<b>search</b> ${esc(state.q)}`);
    const b=el('button',null,'×'); b.onclick=()=>{state.q='';$('#q').value='';render();};
    c.appendChild(b); wrap.appendChild(c);
  }
  return any?wrap:null;
}

/* ---------- paper row ---------- */
function hl(text){
  if(!state.q) return esc(text);
  let out=esc(text);
  state.q.split(/\s+/).filter(Boolean).forEach(t=>{
    out=out.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<em>$1</em>');
  });
  return out;
}
function loopStrip(p){
  const on=new Set(arr(p.loop_stage));
  return `<span class="loopstrip" title="loop stage: ${LOOP.filter(s=>on.has(s)).map(s=>label('loop_stage',s)).join(' → ')||'—'}">`+
    LOOP.map(s=>`<span class="ls${on.has(s)?' on':''}"></span>`).join('')+`</span>`;
}
function markChips(p){
  const c=arr(p.contribution);
  const pri=['dataset','benchmark','method','system','survey','analysis'].filter(x=>c.includes(x)).slice(0,3);
  return `<span class="marks">`+pri.map(x=>{
    const cls=x==='dataset'||x==='benchmark'?'d':(x==='method'?'m':'');
    return `<span class="mark ${cls}">${esc(x.slice(0,4))}</span>`;
  }).join('')+`</span>`;
}
// A paper shows up in several groups when dedupe is off. The first copy keeps the
// plain id and repeats get a suffix, so the id a comment stored stays unique.
const rowSeen=new Set();
function paperRow(p){
  const r=el('div','prow'); r.dataset.id=p.id;
  let rid='row-'+p.id, k=1;
  while(rowSeen.has(rid)) rid='row-'+p.id+'--'+(++k);
  rowSeen.add(rid); r.id=rid;
  const inst=(p.institutions||[])[0]||'';
  const a1=(p.authors||[])[0]||'';
  r.innerHTML=`<div>
      <div class="t">${hl(p.title)}</div>
      <div class="meta"><span class="yr">${esc(p.date||p.year||'')}</span> · ${esc(p.venue||'')}${a1?' · '+esc(a1)+((p.n_authors||1)>1?' et al.':''):''}${inst?' · '+esc(inst):''}</div>
      <div class="tl">${hl(p.tldr||'')}</div>
    </div>
    <div class="side">${markChips(p)}${loopStrip(p)}</div>`;
  r.onclick=()=>openPanel(p.id);
  return r;
}

/* ---------- framework view ---------- */
function groupMatch(p,filter){
  for(const k in filter){
    const want=arr(filter[k]);
    const have=pv(p,k);
    if(!want.some(w=>have.includes(String(w)))) return false;
  }
  return true;
}
function renderFramework(){
  const host=$('#view-framework'); host.innerHTML=''; rowSeen.clear();
  const rows=filtered();

  const lede=el('div','lede'); lede.id='lede';
  lede.innerHTML=`<h1 id="lede-title">Awesome Physical AI</h1>
    <div class="thesis" id="thesis-line">${esc(S.thesis.line)}</div>
    <p id="thesis-body">${esc(S.thesis.body)}</p>`;
  host.appendChild(lede);

  const withCode=rows.filter(p=>arr(p.openness).includes('code')).length;
  const withData=rows.filter(p=>arr(p.contribution).some(c=>c==='dataset'||c==='benchmark')).length;
  const yrs=rows.map(p=>p.year).filter(Boolean);
  const bar=el('div','statbar'); bar.id='statbar';
  bar.innerHTML=[
    ['papers',rows.length],['modeling',rows.filter(p=>arr(p.arc).includes('model')).length],
    ['changing',rows.filter(p=>arr(p.arc).includes('change')).length],
    ['closed loop',rows.filter(p=>p.closes_loop).length],
    ['datasets & benchmarks',withData],['code released',withCode],
    ['years',yrs.length?Math.min(...yrs)+'–'+Math.max(...yrs):'—']
  ].map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
  host.appendChild(bar);

  const leg=el('div','legend'); leg.id='legend';
  leg.innerHTML='<span class="grp2"><b>loop</b>'+
    LOOP.map(s=>`<span class="stage"><span class="ls on"></span>${esc(label('loop_stage',s))}</span>`).join('')+'</span>'+
    '<span class="grp2"><b>contributes</b>'+
    [['meth','m','method'],['data','d','dataset'],['benc','d','benchmark'],['syst','','system'],['anal','','analysis'],['surv','','survey']]
      .map(([k,c,t])=>`<span class="stage"><span class="mark ${c}">${k}</span></span>`).join('')+'</span>'+
    '<span class="muted">every row: click to open the full card</span>';
  host.appendChild(leg);
  const ac=activeChips(); if(ac){ ac.style.margin='0 0 18px'; host.appendChild(ac); }
  if(!rows.length){ host.appendChild(el('div','empty','No paper matches these filters.')); return; }

  S.views.forEach((view,vi)=>{
    const pool=rows.filter(p=>groupMatch(p,view.filter||{}));
    if(!pool.length) return;
    const sec=el('section','arc'); sec.id='arc-'+slugId(view.id);
    const h=el('div','archead');
    h.innerHTML=`<div class="n">${String(vi+1).padStart(2,'0')} — ${pool.length} papers</div>
      <h2 id="${sec.id}-name">${esc(view.name)}</h2><p id="${sec.id}-blurb">${esc(view.blurb)}</p>`;
    sec.appendChild(h);
    const used=new Set();
    const groups=view.groups.slice();
    groups.push({id:view.id+'-rest',name:'Everything else in this arc',sub:'Matches the arc but none of the groups above.',filter:{},pri:999});
    // Array order is the reading order. `pri` is the assignment order, most specific first,
    // so a paper lands in the tightest group that claims it wherever that group is shown.
    const claim={};
    groups.map((g,i)=>({g,i})).sort((a,b)=>(a.g.pri==null?a.i:a.g.pri)-(b.g.pri==null?b.i:b.g.pri))
      .forEach(({g})=>pool.forEach(p=>{
        if(!used.has(p.id)&&groupMatch(p,g.filter||{})){ used.add(p.id); (claim[g.id]=claim[g.id]||[]).push(p); }
      }));
    groups.forEach(g=>{
      const items=(state.dedupe?(claim[g.id]||[]):pool.filter(p=>groupMatch(p,g.filter||{}))).slice();
      if(!items.length) return;
      items.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
      const gd=el('div','grp'); gd.id='grp-'+slugId(view.id)+'-'+slugId(g.id);
      gd.innerHTML=`<div class="grphead"><h3 id="${gd.id}-name">${esc(g.name)}</h3>`+
        `<span class="sub" id="${gd.id}-sub">${esc(g.sub||'')}</span><span class="n">${items.length}</span></div>`;
      const list=el('div','plist');
      items.forEach(p=>list.appendChild(paperRow(p)));
      gd.appendChild(list); sec.appendChild(gd);
    });
    host.appendChild(sec);
  });

  const foot=el('div','tbar');
  const t=el('button','mini', state.dedupe?'Each paper listed once · show in every matching group':'Papers repeat across groups · list each once');
  t.onclick=()=>{state.dedupe=!state.dedupe;render();};
  foot.appendChild(t); host.appendChild(foot);
}

/* ---------- table view ---------- */
const COLDEF=[
  {k:'title',label:'Paper',get:p=>`<span>${hl(p.title)}</span><span class="s">${esc((p.authors||[])[0]||'')}${(p.n_authors||1)>1?' et al.':''}${(p.institutions||[]).length?' · '+esc(p.institutions.join(', ')):''}</span>`,cls:'ttl',sort:p=>p.title},
  {k:'date',label:'Date',get:p=>esc(p.date||''),cls:'num',sort:p=>p.date||''},
  {k:'venue',label:'Venue',get:p=>esc(p.venue||''),sort:p=>p.venue||''},
  {k:'tldr',label:'One line',get:p=>hl(p.tldr||''),sort:p=>p.tldr||''},
  {k:'contribution',label:'Contribution'},{k:'arc',label:'Arc'},{k:'closes_loop',label:'Loop'},
  {k:'loop_stage',label:'Loop stage'},{k:'embodiment',label:'Embodiment'},{k:'human_role',label:'Human role'},
  {k:'world_facet',label:'Models what'},{k:'representation',label:'Representation'},
  {k:'change_channel',label:'Change channel'},{k:'sensing',label:'Sensing'},{k:'regime',label:'Regime'},
  {k:'horizon',label:'Horizon'},{k:'domain',label:'Domain'},{k:'autonomy',label:'Autonomy'},
  {k:'openness',label:'Released'},
  {k:'task',label:'Task',get:p=>esc((p.problem&&p.problem.task)||''),sort:p=>(p.problem&&p.problem.task)||''},
  {k:'intuition',label:'Method intuition',get:p=>esc((p.method&&p.method.intuition)||''),sort:p=>(p.method&&p.method.intuition)||''},
  {k:'headline',label:'Headline result',get:p=>esc((p.experiments&&p.experiments.headline)||''),sort:p=>(p.experiments&&p.experiments.headline)||''}
];
COLDEF.forEach(c=>{
  if(!c.get) c.get=p=>{
    if(c.k==='closes_loop') return p.closes_loop?'<span class="chip r">closed</span>':'<span class="muted">open</span>';
    const vs=pv(p,c.k).filter(v=>v&&v!=='none');
    return vs.length? vs.map(v=>`<span class="chip">${esc(label(c.k,v))}</span>`).join(' ') : '<span class="muted">—</span>';
  };
  if(!c.sort) c.sort=p=>pv(p,c.k).join(',');
});
function renderTable(){
  const host=$('#view-table'); host.innerHTML='';
  const rows=filtered().slice().sort((a,b)=>{
    const c=COLDEF.find(x=>x.k===state.sort.key)||COLDEF[1];
    const A=c.sort(a),B=c.sort(b);
    return (A<B?-1:A>B?1:0)*state.sort.dir;
  });
  const bar=el('div','tbar');
  bar.appendChild(el('span','n',`<b>${rows.length}</b> of ${P.length} papers`));
  const cb=el('button','mini',state.showcols?'Hide columns':'Columns');
  cb.onclick=()=>{state.showcols=!state.showcols;render();};
  bar.appendChild(cb);
  const dl=el('button','mini','Copy JSON');
  dl.onclick=()=>{navigator.clipboard.writeText(JSON.stringify(rows.map(p=>{const q={...p};delete q._blob;return q;}),null,1)).then(()=>{dl.textContent='Copied ✓';setTimeout(()=>dl.textContent='Copy JSON',1400);});};
  bar.appendChild(dl);
  const ac=activeChips(); if(ac) bar.appendChild(ac);
  host.appendChild(bar);

  if(state.showcols){
    const cols=el('div','cols');
    COLDEF.forEach(c=>{
      const on=state.cols.includes(c.k);
      const l=el('label',null,`<input type="checkbox" ${on?'checked':''}>${esc(c.label)}`);
      l.querySelector('input').onchange=e=>{
        if(e.target.checked){ if(!state.cols.includes(c.k)) state.cols.push(c.k); }
        else state.cols=state.cols.filter(x=>x!==c.k);
        render();
      };
      cols.appendChild(l);
    });
    host.appendChild(cols);
  }
  if(!rows.length){ host.appendChild(el('div','empty','No paper matches these filters.')); return; }

  const active=COLDEF.filter(c=>state.cols.includes(c.k));
  const w=el('div','tablewrap');
  const t=el('table'); t.id='papers-table';
  const thead=el('thead');
  const tr=el('tr');
  active.forEach(c=>{
    const th=el('th',null,esc(c.label)+(state.sort.key===c.k?` <span class="ar">${state.sort.dir>0?'▲':'▼'}</span>`:''));
    th.id='th-'+slugId(c.k);
    th.onclick=()=>{ if(state.sort.key===c.k) state.sort.dir*=-1; else state.sort={key:c.k,dir:1}; render(); };
    tr.appendChild(th);
  });
  thead.appendChild(tr); t.appendChild(thead);
  const tb=el('tbody');
  rows.forEach(p=>{
    const r=el('tr'); r.id='t-'+p.id; r.onclick=()=>openPanel(p.id);
    active.forEach(c=>{ const td=el('td',c.cls||null,c.get(p)); td.id='c-'+p.id+'-'+slugId(c.k); r.appendChild(td); });
    tb.appendChild(r);
  });
  t.appendChild(tb); w.appendChild(t); host.appendChild(w);
}

/* ---------- protocol view ---------- */
function renderProtocol(){
  const host=$('#view-protocol');
  if(host.dataset.done) return; host.dataset.done='1';
  const d=el('div','doc'); d.id='protocol';
  const rp=S.reading_protocol;
  let h=`<h1 id="p-title" style="font:600 27px/1.2 var(--sans);letter-spacing:-.025em;margin:2px 0 10px">How a paper is read here</h1>
    <p id="p-note" style="font-family:var(--serif);font-size:16px;color:var(--ink)">${esc(rp.note)}</p>`;
  rp.steps.forEach((s,i)=>{
    const sid='p-step-'+slugId(s.name);
    h+=`<div class="pcard" id="${sid}"><div class="lbl">${String(i+1).padStart(2,'0')}</div>`+
      `<h4 id="${sid}-name">${esc(s.name)}</h4><p id="${sid}-body">${esc(s.body)}</p></div>`;
  });
  h+=`<h3 id="p-shape">The shape a problem setting is written in</h3>
  <pre class="fmt" id="p-format">Inference:
  Inputs
    Component 1
      modality:      video
      tensor:        V ∈ R^{T×H×W×3}
      content:       T = 8–16 frames sampled from 30–300 s egocentric clips
    Component 2
      modality:      text
      tensor:        p
      content:       the recipe step the user was told to perform
  Outputs
    Component 1
      modality:      label
      tensor:        y ∈ {success, mistake}
      content:       one decision per step, causal — no future frames

Training:
  supervision:       correct executions only (one-class)
  note:              what differs from inference, and why</pre>
  <p id="p-rule">The rule is an exhaustive structure with short cells. Every column exists for every paper, and no cell runs past a sentence or two. Detail lives in the paper — this is the index that tells you which paper to open.</p>

  <h2 id="p-columns">Columns</h2>
  <p id="p-columns-note">Sections on the Framework tab are filters over these columns rather than folders. A paper that models the world and changes it carries both values, and appears in both arcs.</p>`;
  d.innerHTML=h;

  ['topic','meta'].forEach(axis=>{
    const fs=S.fields.filter(f=>f.axis===axis&&(f.vocab||f.kind==='bool'));
    if(!fs.length) return;
    const ah=el('h3',null,axis==='topic'?'Physical-AI axes':'Bibliographic and contribution');
    ah.id='p-axes-'+axis; d.appendChild(ah);
    const t=el('table','fieldtable'); t.id='fields-'+axis; const tb=el('tbody');
    fs.forEach(f=>{
      const tr=el('tr'); tr.id='field-'+slugId(f.key);
      tr.appendChild(el('td',null,`${esc(f.label)}<span>${esc(f.key)} · ${esc(f.kind)}</span>`));
      const vals=(f.vocab||[]).map(v=>`<span class="chip">${esc(v.label)}</span>`).join(' ')||'<span class="chip">true</span> <span class="chip">false</span>';
      tr.appendChild(el('td',null,(f.help?`<div style="margin-bottom:6px;color:var(--ink2)">${esc(f.help)}</div>`:'')+`<div class="chips">${vals}</div>`));
      tb.appendChild(tr);
    });
    t.appendChild(tb); d.appendChild(t);
  });

  const dr=el('div');
  dr.innerHTML=`<h3 id="p-dataroles">What was done to the data</h3>
    <p id="p-dataroles-note">Every dataset an experiment touches is tagged with what the authors did to it. In this field that is often the real contribution.</p>
    <div class="chips">${S.data_roles.map(r=>`<span class="chip">${esc(r.label)}</span>`).join(' ')}</div>
    <h2 id="p-adding">Adding a paper</h2>
    <p id="p-adding-note">Drop a JSON object into a file under <code>data/papers/</code> and run <code>python3 build.py</code>. The schema in <code>data/schema.json</code> is the contract; unknown values simply show up as new facet options, so the vocabulary can grow without a migration.</p>
    <p class="muted" id="p-confidence" style="margin-top:26px">Entries marked <b>medium</b> confidence are grounded in the abstract and the authors' own claims but were not read end to end. Venues are recorded from what the source says; a paper listed as arXiv may have been published since.</p>`;
  d.appendChild(dr);
  host.appendChild(d);
}

/* ---------- detail panel ---------- */
let panelList=[], panelIdx=-1;
function ioBlock(title, items){
  if(!items||!items.length) return '';
  return `<div class="io"><div class="iohead">${esc(title)}</div>`+items.map(c=>`
    <div class="iorow">
      <span class="nm">${esc(c.name||'')}</span>${c.modality?`<span class="md">${esc(c.modality)}</span>`:''}
      ${c.tensor?`<div><span class="tn">${esc(c.tensor)}</span></div>`:''}
      ${c.chars?`<div class="ch">${esc(c.chars)}</div>`:''}
    </div>`).join('')+`</div>`;
}
function chipRow(key,p){
  const vs=pv(p,key).filter(v=>v&&v!=='none');
  if(!vs.length) return '<span class="muted">—</span>';
  return vs.map(v=>`<span class="chip">${esc(label(key,v))}</span>`).join(' ');
}
function renderPanel(p){
  const links=Object.entries(p.links||{}).filter(([k,v])=>v)
    .map(([k,v])=>`<a href="${esc(v)}" target="_blank" rel="noopener">${esc(k==='page'?'project page':k)} ↗</a>`).join('');
  const m=p.method||{}, x=p.experiments||{}, pr=p.problem||{};
  const authors=(p.authors||[]).join(', ')+((p.n_authors||0)>(p.authors||[]).length?`, +${p.n_authors-(p.authors||[]).length} more`:'');
  let h=`
   <h1>${esc(p.title)}</h1>
   <div class="byline">${esc(authors)}</div>
   <div class="venue">${esc(p.venue||'')}${p.date?' · '+esc(p.date):''}${(p.institutions||[]).length?' · '+esc(p.institutions.join(' · ')):''}</div>
   <div class="links">${links}</div>
   <div class="tldr">${esc(p.tldr||'')}</div>
   ${p.why?`<div class="why"><b>Why it is on this list.</b> ${esc(p.why)}</div>`:''}

   <div class="sec"><h5>Where it sits</h5>
     <div class="kv"><div class="k">Arc</div><div>${chipRow('arc',p)}</div></div>
     <div class="kv"><div class="k">Loop stage</div><div>${chipRow('loop_stage',p)} ${p.closes_loop?'<span class="chip r">closes the loop</span>':''}</div></div>
     <div class="kv"><div class="k">Embodiment</div><div>${chipRow('embodiment',p)} ${pv(p,'human_role').filter(v=>v&&v!=='none').map(v=>`<span class="chip">human: ${esc(label('human_role',v))}</span>`).join(' ')}</div></div>
     <div class="kv"><div class="k">Models what</div><div>${chipRow('world_facet',p)}</div></div>
     <div class="kv"><div class="k">Representation</div><div>${chipRow('representation',p)}</div></div>
     <div class="kv"><div class="k">Change channel</div><div>${chipRow('change_channel',p)}</div></div>
     <div class="kv"><div class="k">Sensing</div><div>${chipRow('sensing',p)}</div></div>
     <div class="kv"><div class="k">Setting</div><div>${chipRow('regime',p)} ${chipRow('horizon',p)} ${chipRow('domain',p)} ${chipRow('autonomy',p)}</div></div>
     <div class="kv"><div class="k">Contribution</div><div>${chipRow('contribution',p)} ${chipRow('openness',p)}</div></div>
   </div>`;

  if(pr.task||((pr.inference||{}).inputs||[]).length){
    h+=`<div class="sec"><h5>Problem setting</h5>`;
    if(pr.task) h+=`<div style="font-size:13px;margin-bottom:8px">${esc(pr.task)}</div>`;
    h+=ioBlock('Inference · inputs',(pr.inference||{}).inputs);
    h+=ioBlock('Inference · outputs',(pr.inference||{}).outputs);
    const tr=pr.training||{};
    if(tr.supervision||tr.note){
      h+=`<div class="io"><div class="iohead">Training</div>`;
      if(tr.supervision) h+=`<div class="iorow"><span class="nm">supervision</span><div class="ch">${esc(tr.supervision)}</div></div>`;
      if(tr.note) h+=`<div class="iorow"><span class="nm">note</span><div class="ch">${esc(tr.note)}</div></div>`;
      h+=ioBlock('',tr.inputs).replace('<div class="io">','').replace(/<\/div>$/,'');
      h+=`</div>`;
    }
    h+=`</div>`;
  }

  if(m.intuition||(m.components||[]).length){
    h+=`<div class="sec"><h5>Method</h5>`;
    if(m.intuition) h+=`<div style="font-size:13.5px;margin-bottom:9px">${esc(m.intuition)}</div>`;
    if(m.backbone) h+=`<div class="kv"><div class="k">Backbone</div><div>${esc(m.backbone)}</div></div>`;
    if(m.init) h+=`<div class="kv"><div class="k">Init</div><div><span class="chip">${esc(m.init)}</span></div></div>`;
    if((m.family||[]).length) h+=`<div class="kv"><div class="k">Family</div><div>${m.family.map(f=>`<span class="chip k">${esc(f)}</span>`).join(' ')}</div></div>`;
    if((m.components||[]).length) h+=`<div class="kv"><div class="k">Components</div><div><ul class="tight">${m.components.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div></div>`;
    h+=`</div>`;
  }

  if(p.data){
    const dsp=p.data;
    h+=`<div class="sec"><h5>Dataset</h5>`;
    Object.entries(dsp).forEach(([k,v])=>{ h+=`<div class="kv"><div class="k">${esc(k)}</div><div>${esc(Array.isArray(v)?v.join(', '):v)}</div></div>`; });
    h+=`</div>`;
  }

  if((x.datasets||[]).length||x.headline){
    h+=`<div class="sec"><h5>Experiments</h5>`;
    (x.datasets||[]).forEach(d=>{
      const isNew=['new','synthetic','reannotated'].includes(d.role);
      h+=`<div class="dsrow"><span class="role${isNew?' new':''}">${esc(d.role||'')}</span><span>${esc(d.name)}</span></div>`;
    });
    if((x.metrics||[]).length) h+=`<div class="kv" style="margin-top:8px"><div class="k">Metrics</div><div>${x.metrics.map(v=>`<span class="chip">${esc(v)}</span>`).join(' ')}</div></div>`;
    if((x.baselines||[]).length) h+=`<div class="kv"><div class="k">Baselines</div><div>${esc(x.baselines.join('; '))}</div></div>`;
    if(x.headline) h+=`<div class="headline">${esc(x.headline)}</div>`;
    h+=`</div>`;
  }

  if((p.tags||[]).length) h+=`<div class="sec"><h5>Tags</h5><div class="chips">${p.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div></div>`;
  h+=`<div class="conf">Entry confidence: <b>${esc(p.confidence||'—')}</b>. ID <code style="font-family:var(--mono)">${esc(p.id)}</code>.</div>`;
  $('#pbody').innerHTML=h; $('#pbody').scrollTop=0;
  $('#pidx').textContent=(panelIdx+1)+' / '+panelList.length;
}
function openPanel(id){
  panelList=filtered().map(p=>p.id);
  panelIdx=panelList.indexOf(id);
  if(panelIdx<0){ panelList=[id]; panelIdx=0; }
  renderPanel(P.find(p=>p.id===id));
  $('#panel').classList.add('on'); $('#scrim').classList.add('on');
  $('#panel').setAttribute('aria-hidden','false');
  location.hash=id;
}
function closePanel(){
  $('#panel').classList.remove('on'); $('#scrim').classList.remove('on');
  $('#panel').setAttribute('aria-hidden','true');
  if(location.hash) history.replaceState(null,'',location.pathname+location.search);
}
function step(d){
  if(!panelList.length) return;
  panelIdx=(panelIdx+d+panelList.length)%panelList.length;
  const p=P.find(x=>x.id===panelList[panelIdx]); renderPanel(p); location.hash=p.id;
}
$('#pclose').onclick=closePanel; $('#scrim').onclick=closePanel;
$('#pprev').onclick=()=>step(-1); $('#pnext').onclick=()=>step(1);

/* ---------- wiring ---------- */
function setView(v){
  if(!VIEWS.includes(v)||state.view===v) return false;
  state.view=v;
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.view===v)));
  render(); return true;
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
let qt;
$('#q').addEventListener('input',e=>{ clearTimeout(qt); qt=setTimeout(()=>{ state.q=e.target.value.trim(); render(); },110); });
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==$('#q')){ e.preventDefault(); $('#q').focus(); }
  if(e.key==='Escape'){ if($('#panel').classList.contains('on')) closePanel(); else if(document.activeElement===$('#q')) $('#q').blur(); }
  if($('#panel').classList.contains('on')){
    if(e.key==='ArrowLeft'){e.preventDefault();step(-1);} if(e.key==='ArrowRight'){e.preventDefault();step(1);}
  }
});
const root=document.documentElement;
try{ const saved=localStorage.getItem('physai-theme'); if(saved) root.setAttribute('data-theme',saved); }catch(e){}
$('#theme').onclick=()=>{
  const cur=root.getAttribute('data-theme');
  const sysDark=matchMedia('(prefers-color-scheme: dark)').matches;
  const next=cur? (cur==='dark'?'light':'dark') : (sysDark?'light':'dark');
  root.setAttribute('data-theme',next);
  try{ localStorage.setItem('physai-theme',next); }catch(e){}
};
$('#ver').textContent='v'+S.version+' · '+P.length;

// comment-bridge.js drives the tabs when a comment sits on a view you are not on
window.__physai={ views:VIEWS.slice(), view:()=>state.view, setView:setView };

function render(){
  renderFacets();
  VIEWS.forEach(v=>{ $('#view-'+v).hidden = (v!==state.view); });
  // the filter rail has nothing to act on while the protocol doc is open
  document.querySelector('aside:not(#panel)').style.display = state.view==='protocol' ? 'none' : '';
  document.querySelector('.shell').style.gridTemplateColumns = state.view==='protocol' ? 'minmax(0,1fr)' : '';
  if(state.view==='framework') renderFramework();
  else if(state.view==='table') renderTable();
  else renderProtocol();
}
render();
if(location.hash){ const id=location.hash.slice(1); if(P.some(p=>p.id===id)) openPanel(id); }
})();
</script>

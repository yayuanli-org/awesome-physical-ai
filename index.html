<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awesome Physical AI</title>
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#fbfbf9; --bg2:#ffffff; --bg3:#f4f4f1;
  --ink:#17171b; --ink2:#4a4a55; --ink3:#84848f;
  --line:#e5e5e0; --line2:#d3d3cc;
  --rose:#a4386e; --rose-bg:#f7e9f0; --rose-line:#e9c9da;
  --blue:#3a51a8; --blue-bg:#e9ecf7; --blue-line:#cbd3ee;
  --shadow:0 1px 2px rgba(20,20,30,.05),0 8px 24px rgba(20,20,30,.06);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
:root[data-theme="dark"], :root:not([data-theme="light"]).dark-pref{}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0e11; --bg2:#16161a; --bg3:#1c1c21;
    --ink:#ececef; --ink2:#a9a9b4; --ink3:#75757f;
    --line:#26262c; --line2:#33333b;
    --rose:#ffafd7; --rose-bg:#2a1a23; --rose-line:#4a2b3a;
    --blue:#93a9ff; --blue-bg:#16192a; --blue-line:#2c3358;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e11; --bg2:#16161a; --bg3:#1c1c21;
  --ink:#ececef; --ink2:#a9a9b4; --ink3:#75757f;
  --line:#26262c; --line2:#33333b;
  --rose:#ffafd7; --rose-bg:#2a1a23; --rose-line:#4a2b3a;
  --blue:#93a9ff; --blue-bg:#16192a; --blue-line:#2c3358;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--rose-bg)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:14px;padding:10px 20px;max-width:1720px;margin:0 auto}
.brand{font-weight:650;letter-spacing:-.015em;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--rose);flex:none}
.brand .v{font:500 10px/1 var(--mono);color:var(--ink3);border:1px solid var(--line2);
  padding:3px 5px;border-radius:4px;margin-left:2px}
nav{display:flex;gap:2px;background:var(--bg3);padding:3px;border-radius:8px;border:1px solid var(--line)}
nav button{padding:5px 11px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
nav button[aria-selected="true"]{background:var(--bg2);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}
.spacer{flex:1}
.searchwrap{position:relative;flex:1;max-width:420px;min-width:150px}
.searchwrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}
#q{width:100%;padding:6px 30px 6px 29px;border-radius:8px;border:1px solid var(--line2);
  background:var(--bg2);color:var(--ink);font-size:13px;outline:none}
#q:focus{border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-bg)}
.kbd{position:absolute;right:7px;top:50%;transform:translateY(-50%);font:500 10px/1 var(--mono);
  color:var(--ink3);border:1px solid var(--line2);border-radius:4px;padding:3px 4px;background:var(--bg3)}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border-radius:7px;border:1px solid var(--line);color:var(--ink2)}
.iconbtn:hover{background:var(--bg3);color:var(--ink)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:246px minmax(0,1fr);gap:26px;max-width:1720px;margin:0 auto;padding:20px}
aside{position:sticky;top:56px;align-self:start;max-height:calc(100vh - 76px);overflow-y:auto;
  padding-right:6px;padding-bottom:40px}
aside::-webkit-scrollbar{width:7px} aside::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.fhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.fhead b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.clearall{font-size:11.5px;color:var(--rose)}
.facet{border-bottom:1px solid var(--line);padding:8px 0}
.facet > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:600;color:var(--ink2);padding:2px 0;user-select:none}
.facet > summary::-webkit-details-marker{display:none}
.facet > summary .caret{transition:transform .15s;color:var(--ink3);font-size:9px}
.facet[open] > summary .caret{transform:rotate(90deg)}
.facet > summary .n{margin-left:auto;font:500 10px/1 var(--mono);color:var(--ink3)}
.facet .opts{padding:6px 0 4px}
.opt{display:flex;align-items:center;gap:7px;padding:3px 5px;border-radius:6px;cursor:pointer;
  font-size:12.5px;color:var(--ink2);position:relative}
.opt:hover{background:var(--bg3);color:var(--ink)}
.opt input{accent-color:var(--rose);margin:0;width:13px;height:13px;flex:none}
.opt .cnt{margin-left:auto;font:500 10px/1 var(--mono);color:var(--ink3)}
.opt.on{color:var(--ink);font-weight:550}
.opt .tip{display:none}
.opt[data-help]:hover .tip{display:block;position:absolute;left:100%;top:0;margin-left:8px;z-index:60;
  width:210px;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;
  box-shadow:var(--shadow);font-size:11.5px;font-weight:400;color:var(--ink2);line-height:1.45}

/* ---------- shared ---------- */
.lede{max-width:70ch}
.lede h1{font:600 27px/1.2 var(--sans);letter-spacing:-.025em;margin:2px 0 8px}
.lede .thesis{font-family:var(--serif);font-size:16.5px;line-height:1.6;color:var(--ink)}
.lede p{color:var(--ink2);font-size:13.5px}
.statbar{display:flex;flex-wrap:wrap;gap:16px;margin:16px 0 22px;padding:11px 14px;border:1px solid var(--line);
  border-radius:10px;background:var(--bg2)}
.stat{display:flex;flex-direction:column;gap:1px}
.stat b{font:600 15px/1.1 var(--sans);letter-spacing:-.02em}
.stat span{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;line-height:1;padding:4px 7px;
  border-radius:5px;border:1px solid var(--line);background:var(--bg3);color:var(--ink2);white-space:nowrap}
.chip.k{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.chip.r{background:var(--rose-bg);border-color:var(--rose-line);color:var(--rose)}
.chip b{font-weight:600}
.chip button{color:var(--ink3);font-size:13px;line-height:1;padding:0 0 0 2px}
.chip button:hover{color:var(--rose)}
.muted{color:var(--ink3)}
.empty{padding:60px 20px;text-align:center;color:var(--ink3);font-size:13.5px}

/* ---------- framework view ---------- */
.arc{margin:0 0 44px}
.archead{border-top:2px solid var(--ink);padding-top:12px;margin-bottom:6px}
.archead .n{font:600 11px/1 var(--mono);color:var(--rose);letter-spacing:.1em}
.archead h2{font:600 22px/1.25 var(--sans);letter-spacing:-.02em;margin:7px 0 6px}
.archead p{margin:0;color:var(--ink2);font-size:13.5px;max-width:78ch}
.grp{margin-top:24px}
.grphead{display:flex;align-items:baseline;gap:9px;border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:2px}
.grphead h3{font:600 14px/1.3 var(--sans);margin:0;letter-spacing:-.01em}
.grphead .sub{color:var(--ink3);font-size:12.5px;flex:1;min-width:0}
.grphead .n{font:500 10.5px/1 var(--mono);color:var(--ink3)}
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;
  padding:9px 8px 9px 9px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.prow:hover{background:var(--bg2)}
.prow .t{font-weight:560;font-size:13.5px;letter-spacing:-.005em}
.prow .t em{font-style:normal;background:var(--rose-bg);color:var(--rose);border-radius:3px;padding:0 2px}
.prow .meta{font-size:11.5px;color:var(--ink3);margin-top:1px}
.prow .meta .yr{font-family:var(--mono);font-size:11px}
.prow .tl{font-size:12.5px;color:var(--ink2);margin-top:4px;max-width:88ch}
.prow .side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding-top:2px}
.marks{display:flex;gap:3px}
.mark{font:600 9.5px/1 var(--mono);letter-spacing:.04em;padding:3.5px 5px;border-radius:4px;
  border:1px solid var(--line2);color:var(--ink3);text-transform:uppercase}
.mark.m{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.mark.d{background:var(--rose-bg);border-color:var(--rose-line);color:var(--rose)}
.loopstrip{display:flex;gap:2px}
.ls{width:12px;height:4px;border-radius:2px;background:var(--line2)}
.ls.on{background:var(--rose)}

.legend{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin:-8px 0 22px;
  font-size:11.5px;color:var(--ink3)}
.legend .grp2{display:flex;align-items:center;gap:6px}
.legend b{font-weight:600;color:var(--ink2);letter-spacing:.03em;text-transform:uppercase;font-size:10.5px}
.legend .ls{width:11px;height:4px}
.legend .stage{display:flex;align-items:center;gap:3px}

/* ---------- table view ---------- */
.tbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tbar .n{font-size:12.5px;color:var(--ink3)}
.mini{font-size:12px;padding:4px 9px;border:1px solid var(--line2);border-radius:7px;color:var(--ink2);background:var(--bg2)}
.mini:hover{border-color:var(--rose);color:var(--rose)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg2)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th{position:sticky;top:0;z-index:5;background:var(--bg3);text-align:left;font-weight:600;font-size:11px;
  letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);padding:8px 10px;white-space:nowrap;
  border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
th .ar{opacity:.45;font-size:9px}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--bg3)}
td.ttl{font-weight:550;min-width:250px;max-width:420px}
td.ttl .s{color:var(--ink3);font-weight:400;font-size:11.5px;display:block}
td.num{font-family:var(--mono);font-size:11.5px;color:var(--ink2);white-space:nowrap}
.cols{display:flex;flex-wrap:wrap;gap:5px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--bg2);margin-bottom:12px}
.cols label{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink2);
  border:1px solid var(--line);border-radius:6px;padding:3px 7px;cursor:pointer}
.cols label:hover{border-color:var(--line2)}
.cols input{accent-color:var(--rose);margin:0;width:12px;height:12px}

/* ---------- protocol view ---------- */
.doc{max-width:80ch}
.doc h2{font:600 19px/1.3 var(--sans);letter-spacing:-.02em;margin:34px 0 8px;
  border-top:1px solid var(--line);padding-top:16px}
.doc h3{font:600 14px/1.3 var(--sans);margin:22px 0 5px}
.doc p{color:var(--ink2);font-size:13.5px}
.doc code{font-family:var(--mono);font-size:12px;background:var(--bg3);border:1px solid var(--line);
  border-radius:4px;padding:1px 4px}
.pcard{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--bg2);margin:10px 0}
.pcard .lbl{font:600 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--rose)}
.pcard h4{margin:7px 0 5px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.pcard p{margin:0;font-size:13px;color:var(--ink2)}
.fieldtable{width:100%;font-size:12.5px;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;background:var(--bg2);margin:8px 0 18px}
.fieldtable td{border-bottom:1px solid var(--line);padding:8px 11px;vertical-align:top}
.fieldtable tr:last-child td{border-bottom:none}
.fieldtable td:first-child{width:150px;font-weight:600;white-space:nowrap}
.fieldtable td:first-child span{display:block;font:400 10.5px/1.3 var(--mono);color:var(--ink3);font-weight:400}
pre.fmt{font-family:var(--mono);font-size:11.5px;line-height:1.6;background:var(--bg3);border:1px solid var(--line);
  border-radius:10px;padding:14px 16px;overflow-x:auto;color:var(--ink2);margin:8px 0}

/* ---------- detail panel ---------- */
#scrim{position:fixed;inset:0;background:rgba(10,10,14,.34);backdrop-filter:blur(2px);z-index:70;
  opacity:0;pointer-events:none;transition:opacity .16s}
#scrim.on{opacity:1;pointer-events:auto}
#panel{position:fixed;top:0;right:0;height:100%;width:min(660px,94vw);background:var(--bg2);z-index:80;
  border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(100%);
  transition:transform .2s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
#panel.on{transform:none}
.ptop{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex:none}
.ptop .nav{display:flex;gap:4px}
.ptop .nav button{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;
  display:grid;place-items:center;color:var(--ink2);font-size:12px}
.ptop .nav button:hover{background:var(--bg3);color:var(--ink)}
.ptop .idx{font:500 11px/1 var(--mono);color:var(--ink3)}
.pbody{overflow-y:auto;padding:18px 22px 60px}
.pbody h1{font:600 19px/1.32 var(--sans);letter-spacing:-.02em;margin:0 0 7px}
.byline{font-size:12.5px;color:var(--ink2);margin-bottom:3px}
.venue{font-size:12px;color:var(--ink3);margin-bottom:10px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.links a{font-size:11.5px;padding:4px 9px;border:1px solid var(--line2);border-radius:6px;
  text-decoration:none;color:var(--ink2)}
.links a:hover{border-color:var(--rose);color:var(--rose)}
.tldr{font-family:var(--serif);font-size:15.5px;line-height:1.55;padding:12px 15px;border-radius:9px;
  background:var(--rose-bg);border:1px solid var(--rose-line);margin-bottom:8px}
.why{font-size:13px;color:var(--ink2);border-left:2px solid var(--line2);padding-left:11px;margin:12px 0 18px}
.sec{margin:20px 0 0}
.sec > h5{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
  margin:0 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:112px minmax(0,1fr);gap:5px 12px;font-size:12.5px;margin-bottom:4px}
.kv .k{color:var(--ink3);font-size:11.5px;padding-top:2px}
.io{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:7px 0 12px}
.io .iohead{background:var(--bg3);padding:5px 11px;font:600 10.5px/1.4 var(--mono);letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--line)}
.iorow{padding:8px 11px;border-bottom:1px solid var(--line);font-size:12.5px}
.iorow:last-child{border-bottom:none}
.iorow .nm{font-weight:600}
.iorow .md{font:500 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;
  background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-line);border-radius:4px;padding:3px 5px;margin-left:6px}
.iorow .tn{font-family:var(--mono);font-size:11.5px;color:var(--ink);background:var(--bg3);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;display:inline-block;margin-top:4px}
.iorow .ch{color:var(--ink2);font-size:12.5px;margin-top:3px}
ul.tight{margin:4px 0 10px;padding-left:17px;font-size:12.5px;color:var(--ink2)}
ul.tight li{margin:2px 0}
.dsrow{display:flex;gap:7px;align-items:center;font-size:12.5px;padding:3px 0}
.dsrow .role{font:500 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);
  border:1px solid var(--line2);border-radius:4px;padding:3px 5px;flex:none}
.dsrow .role.new{background:var(--rose-bg);border-color:var(--rose-line);color:var(--rose)}
.headline{font-size:13px;color:var(--ink);background:var(--bg3);border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;margin-top:8px}
.conf{font-size:11.5px;color:var(--ink3);margin-top:22px;padding-top:10px;border-top:1px solid var(--line)}

@media (max-width:1080px){
  .shell{grid-template-columns:1fr;gap:14px}
  aside{position:static;max-height:none;border-bottom:1px solid var(--line);padding-bottom:10px}
  .hrow{flex-wrap:wrap}
}

/* ---------- comment layer ---------- */
/* comment-layer.css ships light-only tokens and a handful of hardcoded white
   surfaces. Retune both to this page's palette, in both themes. */
:root{
  --cmt-font:var(--sans);
  --cmt-accent:#eda0c6; --cmt-highlight:rgba(237,160,198,.34); --cmt-highlight-strong:rgba(226,120,175,.62);
  --cmt-ai:#3a51a8; --cmt-ai-bg:#e9ecf7;
  --cmt-ink:#17171b; --cmt-muted:#84848f; --cmt-line:#e5e5e0; --cmt-card:#ffffff;
  --cmt-shadow:0 1px 2px rgba(20,20,30,.06),0 10px 30px rgba(20,20,30,.13);
  --cmt-surface:#ffffff; --cmt-surface2:#f4f4f1;
  --cmt-fab:#17171b; --cmt-fab-ink:#fbfbf9; --cmt-fab-hover:#000;
  --cmt-primary:#a4386e; --cmt-primary-ink:#ffffff; --cmt-primary-hover:#8b2c5c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cmt-accent:#ffafd7; --cmt-highlight:rgba(255,175,215,.20); --cmt-highlight-strong:rgba(255,175,215,.46);
    --cmt-ai:#93a9ff; --cmt-ai-bg:#16192a;
    --cmt-ink:#ececef; --cmt-muted:#8b8b96; --cmt-line:#2b2b33; --cmt-card:#16161a;
    --cmt-shadow:0 1px 2px rgba(0,0,0,.4),0 10px 34px rgba(0,0,0,.55);
    --cmt-surface:#1c1c21; --cmt-surface2:#22222a;
    --cmt-fab:#ececef; --cmt-fab-ink:#0e0e11; --cmt-fab-hover:#ffffff;
    --cmt-primary:#ffafd7; --cmt-primary-ink:#2a1a23; --cmt-primary-hover:#ffc7e3;
  }
}
:root[data-theme="dark"]{
  --cmt-accent:#ffafd7; --cmt-highlight:rgba(255,175,215,.20); --cmt-highlight-strong:rgba(255,175,215,.46);
  --cmt-ai:#93a9ff; --cmt-ai-bg:#16192a;
  --cmt-ink:#ececef; --cmt-muted:#8b8b96; --cmt-line:#2b2b33; --cmt-card:#16161a;
  --cmt-shadow:0 1px 2px rgba(0,0,0,.4),0 10px 34px rgba(0,0,0,.55);
  --cmt-surface:#1c1c21; --cmt-surface2:#22222a;
  --cmt-fab:#ececef; --cmt-fab-ink:#0e0e11; --cmt-fab-hover:#ffffff;
  --cmt-primary:#ffafd7; --cmt-primary-ink:#2a1a23; --cmt-primary-hover:#ffc7e3;
}
/* the hardcoded surfaces, routed through the tokens above */
.cmt-fab{background:var(--cmt-fab);color:var(--cmt-fab-ink)}
.cmt-fab:hover{background:var(--cmt-fab-hover)}
.cmt-pop-head,.cmt-item:hover,.cmt-agent{background:var(--cmt-surface2)}
.cmt-ta,.cmt-who,.cmt-btn,.cmt-pill{background:var(--cmt-surface)}
.cmt-btn:hover,.cmt-btn.cmt-ghost:hover,.cmt-msg-edit:hover{background:var(--cmt-surface2)}
.cmt-btn.cmt-primary{background:var(--cmt-primary);color:var(--cmt-primary-ink);border-color:var(--cmt-primary)}
.cmt-btn.cmt-primary:hover{background:var(--cmt-primary-hover);border-color:var(--cmt-primary-hover)}
.cmt-pin{border-color:var(--cmt-card)}

entric latent world modeling, evaluated by counterfactual VQA and by planning efficiency.","inference":{"inputs":[{"name":"frame","modality":"image","tensor":"x ∈ R^{H×W×3}","chars":"Scenes with several interacting objects."},{"name":"object slots","modality":"latent","tensor":"s ∈ R^{K×d}","chars":"K object-level latents, a small fraction of the patch-token count."}],"outputs":[{"name":"predicted object latents","modality":"latent","tensor":"ŝ_masked ∈ R^{m×d}","chars":"Masked objects inferred from the surrounding objects."}]},"training":{"supervision":"Self-supervised: predict masked object latents from unmasked ones.","note":"Masking at object granularity is what creates the counterfactual query — the model cannot fall back on local texture."}},"method":{"intuition":"Object-centric slots alone do not force a model to learn interaction. Hiding a whole object and demanding its state from context does.","family":["ssl","object-centric"],"backbone":"JEPA-style predictor over slot latents","init":"scratch","components":["object-level latent masking","structured partial observability","formal observability analysis"]},"experiments":{"datasets":[{"name":"object-interaction VQA suites","role":"existing"},{"name":"agent control tasks","role":"existing"}],"metrics":["counterfactual VQA accuracy","planning success vs. latent budget"],"baselines":["patch-masked JEPA with the same architecture","patch-based world models"],"headline":"About +20 points absolute on counterfactual reasoning over the same architecture without object-level masking, and comparable planning using 1% of the latent features."},"why":"The object-centric argument stated at its sharpest: the granularity of the masking objective is the inductive bias.","confidence":"high","tags":["object-centric","JEPA","counterfactual"],"_src":"01-world-models.json"},{"id":"pointworld","short":"PointWorld","title":"PointWorld: Scaling 3D World Models for In-The-Wild Robotic Manipulation","year":2026,"date":"2026-01","venue":"arXiv","venue_type":"preprint","authors":["Wenlong Huang","Yu-Wei Chao","Arsalan Mousavian","Ming-Yu Liu","Dieter Fox","Kaichun Mo"],"n_authors":7,"institutions":["NVIDIA"],"links":{"arxiv":"https://arxiv.org/abs/2601.03782"},"tldr":"Put state and action in the same 3D space as point flow, and one world model serves a Franka and a bimanual humanoid without an embodiment-specific action head.","contribution":["method","analysis"],"openness":["none"],"arc":["model","change"],"closes_loop":true,"loop_stage":["represent","anticipate","decide","act"],"embodiment":["robot"],"human_role":["none"],"world_facet":["scene","object-change","dynamics"],"representation":["geometry","trajectory"],"change_channel":["motor-action","plan"],"sensing":["depth-3d","robot-onboard","sim-render"],"regime":"streaming","horizon":"seconds","domain":["lab-sim","everyday"],"autonomy":"autonomous","problem":{"task":"Action-conditioned 3D forecasting: given RGB-D and a command, predict where every point goes.","inference":{"inputs":[{"name":"RGB-D","modality":"rgbd","tensor":"I ∈ R^{H×W×4}","chars":"One or a few views; open-world scenes, not a fixed rig."},{"name":"action sequence","modality":"action","tensor":"a_{1:K}","chars":"Low-level robot commands, re-expressed as 3D point flow of the robot geometry."}],"outputs":[{"name":"3D point flow","modality":"flow","tensor":"Δp ∈ R^{H×W×3}","chars":"Per-pixel displacement in 3D, at 0.1 s inference, consumed by MPC."}]},"training":{"supervision":"Supervised point-flow forecasting on ~2M real and simulated manipulation trajectories (~500 h).","note":"Because actions are geometry, a single-arm Franka and a bimanual humanoid share one action space."}},"method":{"intuition":"Embodiment-specific action spaces are what stop world models from pooling data. Express the action as motion of the robot's own geometry and the barrier disappears.","family":["transformer","diffusion"],"backbone":"large 3D flow forecaster","init":"scratch","components":["unified 3D point-flow state-action space","cross-embodiment data mixture","MPC integration at 0.1 s"]},"experiments":{"datasets":[{"name":"~2M real + sim manipulation trajectories","role":"new"},{"name":"Franka rigid-body tasks","role":"real-robot"}],"metrics":["flow prediction error","real-world task success"],"baselines":["2D video world models","embodiment-specific action-space models"],"headline":"One pre-trained checkpoint drives a real Franka through rigid-body manipulation at real-time (0.1 s) inference, with an ablation study over backbones, action representations and data mixtures."},"why":"The cleanest counter-argument to pixel-space world models: geometry is the shared coordinate system across embodiments.","confidence":"medium","tags":["3D world model","point flow","cross-embodiment"],"_src":"01-world-models.json"},{"id":"procobject-10k","short":"ProcObject-10K","title":"ProcObject-10K: Benchmarking Object-Centric Procedural Understanding in Instructional Videos","year":2025,"date":"2025-12","venue":"arXiv","venue_type":"preprint","authors":["Wenliang Guo","Yu Kong"],"n_authors":2,"institutions":["Michigan State University"],"links":{"arxiv":"https://arxiv.org/abs/2512.03479"},"tldr":"Procedural video benchmarks ask what the person did. This one asks what happened to the object, and models turn out to answer without being able to point at the evidence.","contribution":["benchmark","dataset","method"],"openness":["data","code"],"arc":["model"],"closes_loop":false,"loop_stage":["represent","verify"],"embodiment":["none"],"human_role":["observed"],"world_facet":["object-state","object-change","procedure"],"representation":["language","pixels"],"change_channel":["none"],"sensing":["egocentric","exocentric"],"regime":"offline","horizon":"minutes","domain":["everyday"],"autonomy":"none","problem":{"task":"Open-ended VideoQA about object preconditions, state evolution, counterfactuals, mistakes and readiness — with temporal grounding of the evidence.","inference":{"inputs":[{"name":"video clip","modality":"video","tensor":"V ∈ R^{T×H×W×3}","chars":"1,799 clips, both egocentric and exocentric, 137 tasks across 9 domains."},{"name":"question","modality":"text","tensor":"q","chars":"One of five reasoning types, all about the object rather than the action."}],"outputs":[{"name":"answer","modality":"text","tensor":"a","chars":"Open-ended, not multiple choice."},{"name":"evidence window","modality":"scalar","tensor":"(t_s, t_e)","chars":"The interval the answer rests on — scored separately, which is where models fall apart."}]},"training":{"supervision":"Benchmark plus an object-centric SFT baseline with pseudo object-level supervision.","note":"Fine-tuning transfers to other grounded VideoQA and embodied planning tasks, so the object supervision is not benchmark-specific."}},"method":{"intuition":"Procedural activity is driven by object state transitions, so a benchmark that never scores object reasoning cannot tell whether a model understands the task or is guessing from language priors.","family":["benchmark","vlm"],"backbone":"","init":"","components":["10,522 open-ended QA pairs","five reasoning types","joint answer + grounding evaluation","object-centric SFT baseline"]},"experiments":{"datasets":[{"name":"ProcObject-10K","role":"new"}],"metrics":["open-ended answer accuracy","grounding mIoU"],"baselines":["13 leading MLLMs, zero-shot and fine-tuned"],"headline":"A large answering-grounding gap: plausible answers with grounding mIoU below 45%, which exposes reliance on linguistic priors over object dynamics."},"why":"Turns the object-centric claim into a measurement, and the measurement says current models are not doing it.","confidence":"high","tags":["object-centric","procedure","benchmark","grounding"],"_src":"02-objects-scenes-physics.json"},{"id":"snow","short":"SNOW","title":"SNOW: Spatio-Temporal Scene Understanding with World Knowledge for Open-World Embodied Reasoning","year":2025,"date":"2025-12","venue":"arXiv","venue_type":"preprint","authors":["Tin Stribor Sohn","Maximilian Dillitzer","Jason J. Corso","Eric Sax"],"n_authors":4,"institutions":["University of Michigan","Karlsruhe Institute of Technology"],"links":{"arxiv":"https://arxiv.org/abs/2512.16461"},"tldr":"VLMs have semantics without geometry and point clouds have geometry without semantics. SNOW fuses them into a queryable 4D scene graph with no training at all.","contribution":["method","system"],"openness":["none"],"arc":["model"],"closes_loop":false,"loop_stage":["sense","represent"],"embodiment":["robot"],"human_role":["none"],"world_facet":["scene","object-state"],"representation":["graph","geometry","language"],"change_channel":["none"],"sensing":["depth-3d","robot-onboard"],"regime":"streaming","horizon":"minutes","domain":["lab-sim"],"autonomy":"autonomous","problem":{"task":"Build a persistent, queryable 4D scene representation that a VLM can reason over.","inference":{"inputs":[{"name":"RGB","modality":"image","tensor":"I_t ∈ R^{H×W×3}","chars":"Synchronized with the point cloud."},{"name":"point cloud","modality":"pointcloud","tensor":"P_t ∈ R^{N×3}","chars":"From the robot's depth sensor."}],"outputs":[{"name":"4D scene graph","modality":"graph","tensor":"G_t","chars":"Object nodes carrying semantic, geometric and temporal attributes, anchored globally by SLAM."}]},"training":{"supervision":"None — training-free and backbone-agnostic.","note":"Every component is an off-the-shelf model. The contribution is the interface between them."}},"method":{"intuition":"Neither the semantic nor the geometric channel is sufficient alone, and fusing them into a persistent graph is a plumbing problem rather than a learning problem.","family":["vlm","classical"],"backbone":"VLM + SAM2 + HDBSCAN + SLAM","init":"prompt-only","components":["HDBSCAN object proposals","SAM2 segmentation","Spatio-Temporal Tokenized Patch Encoding (STEP)","incremental 4D scene graph","SLAM anchoring"]},"experiments":{"datasets":[{"name":"open-world embodied reasoning benchmarks","role":"existing"}],"metrics":["4D scene understanding accuracy","spatial grounding"],"baselines":["VLM-only","geometry-only pipelines"],"headline":"Training-free 4D scene understanding that lets a VLM read spatial structure and temporal dynamics directly off the graph."},"why":"The symbolic-graph answer to world modeling, sitting opposite the latent and pixel answers on the same axis.","confidence":"high","tags":["scene graph","4D","training-free"],"_src":"02-objects-scenes-physics.json"},{"id":"action-effect-pmd","short":"Action Effect Modeling","title":"Procedural Mistake Detection via Action Effect Modeling","year":2025,"date":"2025-12","venue":"ICLR 2026","venue_type":"conference","authors":["Wenliang Guo","Yujiang Pu","Yu Kong"],"n_authors":3,"institutions":["Michigan State University"],"links":{"arxiv":"https://arxiv.org/abs/2512.03474"},"tldr":"Existing detectors watch how the action was performed. Many errors only show up in what it produced, so model the effect frame instead.","contribution":["method"],"openness":["none"],"arc":["change"],"closes_loop":false,"loop_stage":["represent","verify"],"embodiment":["human"],"human_role":["observed"],"world_facet":["object-change","object-state","procedure"],"representation":["graph","latent","language"],"change_channel":["alert"],"sensing":["egocentric"],"regime":"offline","horizon":"seconds","domain":["everyday"],"autonomy":"autonomous","problem":{"task":"One-class procedural mistake detection using both execution and outcome.","inference":{"inputs":[{"name":"action segment","modality":"video","tensor":"V_{t_s:t_e}","chars":""},{"name":"task prompt","modality":"text","tensor":"p","chars":"Task-specific, encoding the intended execution semantics."}],"outputs":[{"name":"mistake score","modality":"scalar","tensor":"s ∈ R","chars":"One-class setting: trained on correct executions only."}]},"training":{"supervision":"Correct executions only. Symbolic scene graphs and visual grounding supply the effect representation.","note":"Effect-frame selection is itself learned, based on semantic relevance and visual quality."}},"method":{"intuition":"A wrong outcome can follow a perfectly normal-looking motion, so a detector that only watches the motion is structurally blind to a whole class of errors.","family":["vlm","graph"],"backbone":"effect-aware representation + prompt-based detector","init":"finetune","components":["informative effect-frame selection","visual grounding + symbolic scene graph fusion","task-prompted detection head"]},"experiments":{"datasets":[{"name":"EgoPER","role":"existing"},{"name":"CaptainCook4D","role":"existing"}],"metrics":["one-class detection AUC / F1"],"baselines":["execution-only mistake detectors"],"headline":"State of the art on EgoPER and CaptainCook4D under the one-class setting by modeling execution and outcome jointly."},"why":"The verify-stage counterpart of the object-change axis: what changed matters more than what was done.","confidence":"high","tags":["mistakes","state change","one-class"],"_src":"06-verify-mistakes.json"},{"id":"sneakpeek","short":"SneakPeek","title":"SneakPeek: Future-Guided Instructional Streaming Video Generation","year":2025,"date":"2025-12","venue":"arXiv","venue_type":"preprint","authors":["Cheeun Hong","German Barquero","Fadime Sener","Markos Georgopoulos","Edgar Schönfeld","Stefan Popov"],"n_authors":9,"institutions":["Meta Reality Labs"],"links":{"arxiv":"https://arxiv.org/abs/2512.13019"},"tldr":"Streaming a multi-step demonstration drifts because each frame is generated blind to the step after next. Anticipate future keyframes and generate toward them.","contribution":["method"],"openness":["none"],"arc":["change"],"closes_loop":true,"loop_stage":["anticipate","act"],"human_role":["assisted"],"embodiment":["human"],"world_facet":["procedure","object-change"],"representation":["pixels"],"change_channel":["visual-guidance"],"sensing":["egocentric","exocentric"],"regime":"streaming","horizon":"minutes","domain":["everyday"],"autonomy":"human-in-loop","problem":{"task":"Generate a stepwise instructional video, streaming, from an initial image and structured step prompts.","inference":{"inputs":[{"name":"initial image","modality":"image","tensor":"x₀","chars":"The user's scene."},{"name":"multi-step prompts","modality":"text","tensor":"(s₁..s_K)","chars":"One per procedural step, giving fine-grained control over the sequence."}],"outputs":[{"name":"streaming video","modality":"video","tensor":"V_t emitted causally","chars":"Interactive — future steps can be changed while generation runs."}]},"training":{"supervision":"Causal adaptation of a diffusion model to next-frame prediction plus future keyframe anticipation.","note":"Dual-region KV caching addresses exposure bias, which is the specific reason long autoregressive rollouts drift."}},"method":{"intuition":"An instructional demonstration has a known destination, so let the generator see the destination instead of only the last frame.","family":["diffusion","transformer"],"backbone":"autoregressive video diffusion","init":"finetune","components":["predictive causal adaptation","future-guided self-forcing with dual-region KV cache","multi-prompt conditioning"]},"experiments":{"datasets":[{"name":"instructional video corpora","role":"existing"}],"metrics":["temporal consistency","step controllability","drift over length"],"baselines":["video diffusion without future guidance"],"headline":"Mitigates temporal drift and preserves motion consistency across long multi-step sequences, with interactive control over what comes next."},"why":"The streaming regime applied to the visual-guidance channel, which is what an on-glasses demonstration would need.","confidence":"medium","tags":["visual guidance","streaming","video generation"],"_src":"10-guidance-skill-fabrication.json"},{"id":"ego-extra","short":"Ego-EXTRA","title":"Ego-EXTRA: video-language Egocentric Dataset for EXpert-TRAinee assistance","year":2 n","transformer"],"backbone":"autoregressive video world model + 3D memory","init":"finetune","components":["geometry-grounded long-term spatial memory","store and retrieve mechanisms","purpose-built training and evaluation sets"]},"experiments":{"datasets":[{"name":"curated long-horizon world-generation sets","role":"new"}],"metrics":["scene consistency on revisit","generation quality","context length"],"baselines":["context-window-limited video world models"],"headline":"Better quality, consistency and usable context length than baselines on long-horizon world generation."},"why":"Names the specific reason generative world models cannot yet stand in for a persistent physical environment.","confidence":"high","tags":["world model","memory","consistency"],"_src":"09-scenes-4d-physics-checks.json"},{"id":"ego-hoibench","short":"Ego-HOIBench","title":"Egocentric Human-Object Interaction Detection: A New Benchmark and Method","year":2025,"date":"2025-06","venue":"arXiv","venue_type":"preprint","authors":["Kunyuan Deng","Yi Wang","Lap-Pui Chau"],"n_authors":3,"institutions":["Hong Kong Polytechnic University"],"links":{"arxiv":"https://arxiv.org/abs/2506.14189"},"tldr":"Third-person HOI detectors collapse from a head-mounted camera, where the hand occludes the object it is holding. 27K annotated egocentric images and a hand-geometry fix.","contribution":["dataset","benchmark","method"],"openness":["data"],"arc":["model"],"closes_loop":false,"loop_stage":["sense","represent"],"human_role":["observed"],"embodiment":["human"],"world_facet":["interaction","object-state","agent-body"],"representation":["graph","geometry"],"change_channel":["none"],"sensing":["egocentric"],"regime":"offline","horizon":"frame","domain":["everyday"],"autonomy":"none","problem":{"task":"Detect hand-verb-object triplets from a first-person image.","inference":{"inputs":[{"name":"egocentric image","modality":"image","tensor":"x ∈ R^{H×W×3}","chars":"27K images, 123 interaction categories, single- t":["human"],"world_facet":["procedure","object-state"],"representation":["language","latent"],"change_channel":["none"],"sensing":["egocentric"],"regime":"interactive","horizon":"hours","domain":["everyday"],"autonomy":"autonomous","problem":{"task":"Question answering over egocentric video spanning days to weeks.","inference":{"inputs":[{"name":"ultra-long egocentric video","modality":"video","tensor":"V, |V| ≈ days","chars":"Week-long recordings; no model ingests this directly."},{"name":"question","modality":"text","tensor":"q","chars":"Human-verified, from hybrid sources."}],"outputs":[{"name":"tool call sequence","modality":"program","tensor":"(τ₁..τ_k)","chars":"One tool per step — temporal retrieval, multimodal understanding."},{"name":"answer","modality":"text","tensor":"a","chars":""}]},"training":{"supervision":"SFT on Ego-CoTT-25K, then RL on Ego-QA-4.4K.","note":"The agent decides which tool to call, so the context problem becomes a policy problem."}},"method":{"intuition":"Long-context reasoning over a life is retrieval scheduling, and scheduling is something an RL agent can learn.","family":["llm","rl"],"backbone":"pretrained LM agent","init":"finetune","components":["Chain-of-Tool-Thought","two-stage SFT then RL","Ego-R1 Data","week-long Ego-R1 Bench"]},"experiments":{"datasets":[{"name":"Ego-R1 Data","role":"new"},{"name":"Ego-R1 Bench","role":"new"}],"metrics":["QA accuracy over week-long video"],"baselines":["long-context video LLMs"],"headline":"Tool-augmented chain-of-thought handles ultra-long egocentric reasoning where direct long-context models do not."},"why":"Pushes the temporal horizon of this list from a clip to a life, which is the scale a wearable assistant actually operates at.","confidence":"high","tags":["long video","egocentric","agent","RL"],"_src":"09-scenes-4d-physics-checks.json"},{"id":"object-concepts-motion","short":"Object Concepts from Motion","title":"Object Concepts Emerge from Motion","year":2025,"date":"2025-05","venue":"arXiv","venue_type":"preprint","authors":["Haoqian Liang","Xiaohui Wang","Zhichao Li","Ya Yang","Naiyan Wang"],"n_authors":5,"institutions":[],"links":{"arxiv":"https://arxiv.org/abs/2505.21635"},"tldr":"Motion boundaries are free instance labels: cluster optical flow into pseudo-masks and train a contrastive encoder that learns objecthood without a single annotation.","contribution":["method"],"openness":["code"],"arc":["model"],"closes_loop":false,"loop_stage":["sense","represent"],"embodiment":["none"],"human_role":["none"],"world_facet":["object-state"],"representation":["latent"],"change_channel":["none"],"sensing":["web-video"],"regime":"offline","horizon":"frame","domain":["web"],"autonomy":"none","problem":{"task":"Unsupervised object-centric representation learning from raw video.","inference":{"inputs":[{"name":"image","modality":"image","tensor":"x ∈ R^{H×W×3}","chars":"Single frame at test time; no flow needed."}],"outputs":[{"name":"dense features","modality":"latent","tensor":"f ∈ R^{H'×W'×d}","chars":"Instance-aware features probed for depth, 3D detection, occupancy."}]},"training":{"supervision":"None. Pseudo instance masks come from off-the-shelf optical flow plus clustering.","note":"No camera calibration required, which is what makes it scale to unstructured video."}},"method":{"intuition":"Infants learn objecthood by watching things move together. Motion boundaries are the same signal, and they are already computable.","family":["ssl","contrastive"],"backbone":"ViT","init":"scratch","components":["optical-flow instance proposals","clustering into pseudo-masks","instance-level contrastive objective"]},"experiments":{"datasets":[{"name":"unstructured driving and scene video","role":"existing"},{"name":"monocular depth benchmarks","role":"existing"},{"name":"3D detection / occupancy benchmarks","role":"existing"}],"metrics":["depth error","3D detection AP","occupancy IoU"],"baselines":["supervised pretraining","prior self-supervised encoders"],"he : Transforming How-To Videos into Task Assistants","year":2025,"date":"2025-05","venue":"UIST 2025","venue_type":"conference","authors":["Mina Huh","Zihui Xue","Ujjaini Das","Kumar Ashutosh","Kristen Grauman","Amy Pavel"],"n_authors":6,"institutions":["UT Austin"],"links":{"arxiv":"https://arxiv.org/abs/2506.00717","page":"https://minahuh.com/Vid2Coach/"},"tldr":"Watch what rehabilitation therapists actually do when guiding blind cooks, then build the system to do that. Errors drop 58.5%.","contribution":["system","analysis"],"openness":["none"],"arc":["change"],"closes_loop":true,"loop_stage":["sense","decide","act","verify"],"embodiment":["human"],"human_role":["assisted","evaluator"],"world_facet":["procedure","object-state"],"representation":["language","pixels"],"change_channel":["language","alert"],"sensing":["egocentric","audio"],"regime":"interactive","horizon":"minutes","domain":["everyday"],"autonomy":"mixed-initiative","problem":{"task":"Turn a how-to video into a wearable-camera assistant that gives accessible instructions and monitors progress.","inference":{"inputs":[{"name":"how-to video","modality":"video","tensor":"V_ref","chars":"Offline: the source recipe or tutorial."},{"name":"live camera","modality":"video","tensor":"V_live","chars":"From commercial smart glasses, streaming."},{"name":"user speech","modality":"speech","tensor":"q","chars":"Questions asked mid-task."}],"outputs":[{"name":"instruction","modality":"speech","tensor":"i_t","chars":"Augmented with demonstration detail and explicit completion criteria."},{"name":"proactive feedback","modality":"speech","tensor":"f_t","chars":"Unprompted, when progress deviates."}]},"training":{"supervision":"No model training — retrieval-augmented generation over BLV-specific resources plus VLM inference.","note":"The design comes from observing visual rehabilitation therapists, which is the part that generalizes beyond this system."}},"method":{"intuition":"Video instructions assume visual comparison iffusion"]},"experiments":{"datasets":[{"name":"EVT-Bench","role":"new"},{"name":"public tracking benchmarks","role":"existing"},{"name":"real-world deployment","role":"real-robot"}],"metrics":["tracking success","robustness under occlusion","inference rate"],"baselines":["modular recognition + planning pipelines"],"headline":"State of the art on public benchmarks zero-shot, holding up under occlusion and scene dynamics in the real world at 10 FPS."},"why":"A good example of a task where perception and action cannot be cleanly separated, which is the loop argument in miniature.","confidence":"high","tags":["VLA","tracking","navigation"],"_src":"07-robot-embodiment.json"},{"id":"dexumi","short":"DexUMI","title":"DexUMI: Using Human Hand as the Universal Manipulation Interface for Dexterous Manipulation","year":2025,"date":"2025-05","venue":"RSS 2025","venue_type":"conference","authors":["Mengda Xu","Han Zhang","Yifan Hou","Zhenjia Xu","Linxi Fan","Shuran Song"],"n_authors":7,"institutions":["Stanford University","Columbia University"],"links":{"arxiv":"https://arxiv.org/abs/2505.21864"},"tldr":"Close the embodiment gap physically with a hand exoskeleton and visually by inpainting the robot hand over the human one. The human demonstration is then already robot data.","contribution":["method","system"],"openness":["code"],"arc":["change"],"closes_loop":false,"loop_stage":["sense","act"],"embodiment":["human+robot"],"human_role":["demonstrator"],"world_facet":["agent-body","interaction"],"representation":["trajectory","pixels"],"change_channel":["motor-action"],"sensing":["egocentric","tactile"],"regime":"offline","horizon":"seconds","domain":["lab-sim","everyday"],"autonomy":"autonomous","problem":{"task":"Collect dexterous demonstrations with a human hand and train a policy for a robot hand directly on them.","inference":{"inputs":[{"name":"wrist-camera video","modality":"video","tensor":"V","chars":"Recorded during human demonstration; the human hand is replaced by an inpainted robot hand."}],"outputs":[{"name":"robot hand action","modality":"action","tensor":"a_t","chars":"Directly executable — the exoskeleton constrained the human motion to be feasible."}]},"training":{"supervision":"Behavior cloning on the adapted demonstrations.","note":"Two gaps are closed by two different means: kinematics by hardware, appearance by inpainting."}},"method":{"intuition":"Remove the human-robot embodiment gap instead of learning to bridge it: physically with an exoskeleton, visually with inpainting.","family":["imitation","diffusion"],"backbone":"visuomotor policy over inpainted observations","init":"scratch","components":["wearable hand exoskeleton with haptic feedback","high-fidelity robot hand inpainting","policy learning on two robot hand platforms"]},"experiments":{"datasets":[{"name":"human demonstrations via exoskeleton","role":"new"},{"name":"two dexterous hand platforms","role":"real-robot"}],"metrics":["task success rate"],"baselines":["teleoperation-collected data"],"headline":"86% average task success across real-world experiments on two different dexterous hand platforms."},"why":"The human hand as an interface rather than as a source of imitation — an underrated third option between teleoperation and video.","confidence":"high","tags":["human+robot","dexterous","data collection"],"_src":"08-human-to-robot-and-together.json"},{"id":"twist","short":"TWIST","title":"TWIST: Teleoperated Whole-Body Imitation System","year":2025,"date":"2025-05","venue":"arXiv","venue_type":"preprint","authors":["Yanjie Ze","Zixuan Chen","João Pedro Araújo","Zi-ang Cao","Xue Bin Peng","C. Karen Liu"],"n_authors":7,"institutions":["Stanford University","Simon Fraser University"],"links":{"arxiv":"https://arxiv.org/abs/2505.02833","page":"https://humanoid-teleop.github.io"},"tldr":"One controller for the whole humanoid body driven by a person's motion, so locomotion and manipulation stop being separate systems.","contribution":["system","method"],"ope ags":["teleoperation","humanoid","whole-body"],"_src":"08-human-to-robot-and-together.json"},{"id":"spot-on","short":"Spot-On","title":"Spot-On: A Mixed Reality Interface for Multi-Robot Cooperation","year":2025,"date":"2025-05","venue":"arXiv","venue_type":"preprint","authors":["Tim Engelbracht","Petar Lukovic","Tjark Behrens","Kai Lascheit","René Zurbrügg","Marc Pollefeys"],"n_authors":8,"institutions":["ETH Zurich"],"links":{"arxiv":"https://arxiv.org/abs/2505.22539"},"tldr":"Mixed reality as the control surface for a team of quadrupeds working on drawers, doors and light switches in a real building.","contribution":["system"],"openness":["none"],"arc":["change"],"closes_loop":true,"loop_stage":["decide","act"],"embodiment":["human+robot"],"human_role":["collaborator","evaluator"],"world_facet":["scene","object-state"],"representation":["geometry","language"],"change_channel":["plan","motor-action","visual-guidance"],"sensing":["egocentric","robot-onboard","depth-3d"],"regime":"interactive","horizon":"minutes","domain":["everyday","industrial"],"autonomy":"mixed-initiative","problem":{"task":"Let one person direct multiple legged robots through semantically diverse environments from a mixed-reality interface.","inference":{"inputs":[{"name":"user selection in MR","modality":"graph","tensor":"target object / task","chars":"Pointed at directly in the room rather than typed."},{"name":"robot state and scene","modality":"pointcloud","tensor":"s_t","chars":"Shared between robots and the headset."}],"outputs":[{"name":"robot task assignment","modality":"plan","tensor":"π","chars":"Includes articulated objects — drawers, swing doors — and building infrastructure like light switches."}]},"training":{"supervision":"None — a systems contribution evaluated by user study.","note":"The interesting part is which decisions stay with the person and which go to the robots."}},"method":{"intuition":"Coordinating several robots in a real building is an interface problem before it is a planning problem.","family":["system"],"backbone":"MR headset + multi-robot stack","init":"","components":["MR task specification interface","multi-quadruped coordination","articulated-object interaction","user study"]},"experiments":{"datasets":[{"name":"user study","role":"new"}],"metrics":["usability ratings","task completion"],"baselines":["conventional multi-robot control interfaces"],"headline":"Participants rated design and usability \"good\" or \"very good\" in almost all cases."},"why":"The human-and-robot branch as an interaction problem, which is where most of it actually lives.","confidence":"high","tags":["mixed reality","multi-robot","HRI"],"_src":"08-human-to-robot-and-together.json"},{"id":"metascenes","short":"MetaScenes","title":"MetaScenes: Towards Automated Replica Creation for Real-world 3D Scans","year":2025,"date":"2025-05","venue":"CVPR 2025","venue_type":"conference","authors":["Huangyue Yu","Baoxiong Jia","Yixin Chen","Yandan Yang","Puhao Li","Siyuan Huang"],"n_authors":12,"institutions":["BIGAI"],"links":{"arxiv":"https://arxiv.org/abs/2505.02388"},"tldr":"Simulatable scenes have been artist-built and therefore scarce. Scan a real room, auto-replace every object with a matched simulatable asset, and the scarcity goes away.","contribution":["dataset","method","benchmark"],"openness":["data","code"],"arc":["model"],"closes_loop":false,"loop_stage":["sense","represent"],"human_role":["none"],"embodiment":["sim"],"world_facet":["scene","object-state"],"representation":["geometry","physics-params"],"change_channel":["none"],"sensing":["depth-3d","sim-render"],"regime":"offline","horizon":"frame","domain":["lab-sim","everyday"],"autonomy":"none","problem":{"task":"Turn a real-world 3D scan into an interactive simulatable replica without an artist.","inference":{"inputs":[{"name":"3D scan","modality":"pointcloud","tensor":"P","chars":"Real rooms, cluttered and noisy."}],"outputs":[{"name":"simulatable scene","modality":"mesh","tensor":"S","chars":"15,366 objects across 831 fine-grained categories, each replaced by a matched asset."}]},"training":{"supervision":"Scan2Sim is a multi-modal alignment model trained to pick the right asset for each scanned object.","note":"The bottleneck it removes is human labour, so the contribution is a pipeline as much as a dataset."}},"method":{"intuition":"Embodied AI needs the diversity of the real world in a form physics can act on, and only automation gets both.","family":["transformer","system"],"backbone":"Scan2Sim multi-modal alignment","init":"finetune","components":["scan-to-asset replacement","MetaScenes dataset","scene synthesis benchmark","vision-and-language navigation transfer benchmark"]},"experiments":{"datasets":[{"name":"MetaScenes","role":"new"},{"name":"VLN transfer benchmark","role":"remix"}],"metrics":["asset matching quality","layout synthesis","navigation transfer"],"baselines":["artist-designed scene datasets"],"headline":"Supports more generalizable agent learning and better sim-to-real alignment than artist-built alternatives."},"why":"Bridges the geometry papers above and the simulator papers below: reconstruction is only useful once it is actionable.","confidence":"high","tags":["3D scenes","simulation","dataset"],"_src":"09-scenes-4d-physics-checks.json"},{"id":"vtv-llm","short":"VTV-LLM","title":"Universal Visuo-Tactile Video Understanding for Embodied Interaction","year":2025,"date":"2025-05","venue":"arXiv","venue_type":"preprint","authors":["Yifan Xie","Mingyang Li","Shoujie Li","Xingting Li","Guangyu Chen","Fei Ma"],"n_authors":8,"institutions":[],"links":{"arxiv":"https://arxiv.org/abs/2505.22566"},"tldr":"Hardness, elasticity and friction are invisible. 150K frames across three tactile sensors, aligned to language, so a model can say what a surface feels like.","contribution":["dataset","method"],"openness":["none"],"arc":["model"],"closes_loop":false,"loop_stage":["sense","represent"],"human_role":["none"],"embodiment":["robot"],"world_facet":["object-state","dynamics","interaction"],"representation":["language","latent"],"change_channel":["none"],"sensing":["tactile"],"regime":"offline","horizon":"seconds","domain":["lab-sim"],"autonomy":"none","problem":{"task":"Answer questions about physical attributes from tactile video.","inference":{"inputs":[{"name":"visuo-tactile video","modality":"force","tensor":"T ∈ R^{F×H×W×3}","chars":"From GelSight Mini, DIGIT or Tac3D — cross-sensor by construction."},{"name":"question","modality":"text","tensor":"q","chars":""}],"outputs":[{"name":"tactile description","modality":"text","tensor":"a","chars":"Grounded in hardness, protrusion, elasticity and friction."}]},"training":{"supervision":"VTV150K: 150,000 frames from 100 objects, annotated with four tactile attributes.","note":"Three-stage training — representation, cross-modal alignment, then prompt fine-tuning."}},"method":{"intuition":"Vision and language cannot recover the physical attributes that only contact reveals, so the tactile stream has to enter the model rather than sit beside it.","family":["vlm","llm"],"backbone":"multi-modal LLM over tactile video","init":"finetune","components":["VTV150K dataset across three sensors","visuo-tactile representation stage","VTV-text alignment","prompt fine-tuning"]},"experiments":{"datasets":[{"name":"VTV150K","role":"new"}],"metrics":["attribute reasoning accuracy","cross-sensor generalization"],"baselines":["vision-language models without tactile input"],"headline":"The first multi-modal LLM for universal visuo-tactile video understanding, spanning three different tactile sensors."},"why":"The one sensing channel on this list that no camera substitutes for, and the axis most of the field still ignores.","confidence":"medium","tags":["tactile","physical attributes","dataset"],"_src":"09-scenes-4d-physics-checks.json"},{"id":"skillformer","short":"SkillFormer","title":"SkillFormer: Unified Multi-View Video Understanding for Proficiency Estimation","year":2025,"date":"2025-05","venue":"ICMV 2025","venue_type":"conference","authors":["Edoardo Bianchi","Antonio Liotta"],"n_authors":2,"institutions":["Free University of Bozen-Bolzano"],"links":{"arxiv":"https://arxiv.org/abs/2505.08665","page":"https://edowhite.github.io/SkillFormer"},"tldr":"Fuse the performer's own view with the outside views through cross-attention and LoRA, and proficiency estimation gets better while using 4.5× fewer parameters.","contribution":["method"],"openness":["code"],"arc":["change"],"closes_loop":false,"loop_stage":["represent","verify"],"human_role":["observed"],"embodiment":["human"],"world_facet":["agent-body","procedure"],"representation":["latent"],"change_channel":["alert"],"sensing":["egocentric","exocentric","multi-view"],"regime":"offline","horizon":"minutes","domain":["skill"],"autonomy":"none","problem":{"task":"Estimate how skilled the performer is, from synchronized egocentric and exocentric video.","inference":{"inputs":[{"name":"multi-view video","modality":"video","tensor":"(V_ego, V_exo^{1..k})","chars":"Ego-Exo4D structured activities — bouldering, cooking, music, basketball."}],"outputs":[{"name":"proficiency level","modality":"label","tensor":"y ∈ {novice … expert}","chars":""}]},"training":{"supervision":"Proficiency labels from Ego-Exo4D; only a LoRA subset of parameters is updated.","note":"3.75× fewer training epochs than prior baselines, which matters because multi-view models are usually the expensive option."}},"method":{"intuition":"Each viewpoint sees a different part of the skill, so fuse them adaptively rather than picking one or averaging.","family":["transformer"],"backbone":"TimeSformer + CrossViewFusion","init":"finetune","components":["multi-head cross-view attention","learnable gating","adaptive self-calibration","LoRA fine-tuning"]},"experiments":{"datasets":[{"name":"Ego-Exo4D","role":"existing"}],"metrics":["proficiency classification accuracy","parameter and epoch cost"],"baselines":["prior multi-view proficiency estimators"],"headline":"State-of-the-art multi-view accuracy on Ego-Exo4D with 4.5× fewer parameters and 3.75× fewer training epochs."},"why":"Judging skill is the prerequisite for coaching it, and this is the cheapest current way to do it across views.","confidence":"high","tags":["proficiency","ego-exo","skill"],"_src":"10-guidance-skill-fabrication.json"},{"id":"brickgpt","short":"BrickGPT","title":"Generating Physically Stable and Buildable Brick Structures from Text","year":2025,"date":"2025-05","venue":"arXiv","venue_type":"preprint","authors":["Ava Pun","Kangle Deng","Ruixuan Liu","Deva Ramanan","Changliu Liu","Jun-Yan Zhu"],"n_authors":6,"institutions":["CMU"],"links":{"arxiv":"https://arxiv.org/abs/2505.05469","page":"https://avalovelace1.github.io/BrickGPT/"},"tldr":"Generate a brick model one brick at a time, and prune each candidate token against gravity and assembly constraints, so the output is something a hand or an arm can actually build.","contribution":["method","dataset"],"openness":["code","data","weights"],"arc":["change"],"closes_loop":true,"loop_stage":["decide","act","verify"],"human_role":["collaborator"],"embodiment":["human+robot"],"world_facet":["object-state","dynamics","procedure"],"representation":["tokens","physics-params"],"change_channel":["fabrication","plan"],"sensing":["sim-render"],"regime":"offline","horizon":"minutes","domain":["everyday","industrial"],"autonomy":"autonomous","problem":{"task":"Text to a physically stable, buildable interconnecting brick assembly.","inference":{"inputs":[{"name":"prompt","modality":"text","tensor":"ℓ","chars":"A described object."}],"outputs":[{"name":"brick sequence","modality":"tokens","tensor":"(b₁..b_K)","chars":"Next-brick prediction; each brick is a placement token."},{"name":"assembly","modality":"mesh","tensor":"A","chars":"Verified stable, and assembled in practice by hand and by a robot arm."}]},"training":{"supervision":"StableText2Brick: 47,000+ physically stable structures over 28,000+ unique 3D objects with captions.","note":"Physics enters at inference as a rollback that prunes infeasible tokens, so stability is enforced rather than hoped for."}},"method":{"intuition":"A generative model will happily emit a structure that falls over, so put the physics check inside the decoding loop rather than after it.","family":["llm","transformer"],"backbone":"autoregressive LM over brick tokens","init":"finetune","components":["StableText2Brick dataset","next-brick prediction","validity check and physics-aware rollback","text-based brick texturing"]},"experiments":{"datasets":[{"name":"StableText2Brick","role":"new"},{"name":"manual and robot-arm assembly trials","role":"real-robot"}],"metrics":["stability rate","prompt alignment","diversity"],"baselines":["text-to-3D generation without physics constraints"],"headline":"Stable, diverse structures that match the prompt, assembled both by hand and automatically by robotic arms."},"why":"The one paper here whose output is matter. Generation with a buildability constraint is what separates design from physical AI.","confidence":"high","tags":["fabrication","physics","generation"],"_src":"10-guidance-skill-fabrication.json"},{"id":"egodex","short":"EgoDex","title":"EgoDex: Learning Dexterous Manipulation from Large-Scale Egocentric Video","year":2025,"date":"2025-05","venue":"ICLR 2026","venue_type":"conference","authors":["Ryan Hoque","Peide Huang","David J. Yoon","Mouli Sivapurapu","Jian Zhang"],"n_authors":5,"institutions":["Apple"],"links":{"arxiv":"https://arxiv.org/abs/2505.11709"},"tldr":"829 hours of egocentric video with every finger joint tracked at recording time, because Apple Vision Pro can do the tracking that Ego4D never had.","contribution":["dataset","benchmark"],"openness":["data"],"arc":["model","change"],"closes_loop":false,"loop_stage":["sense","represent","anticipate"],"human_role":["demonstrator"],"embodiment":["human"],"world_facet":["agent-body","interaction"],"representation":["trajectory","geometry"],"change_channel":["motor-action"],"sensing":["egocentric","multi-view","depth-3d"],"regime":"offline","horizon":"seconds","domain":["everyday"],"autonomy":"none","problem":{"task":"Hand trajectory prediction from egocentric video, as a stand-in for dexterous imitation at internet scale.","inference":{"inputs":[{"name":"egocentric video","modality":"video","tensor":"V","chars":"194 tabletop tasks, from tying shoelaces to folding laundry."}],"outputs":[{"name":"3D hand and finger trajectory","modality":"hand-pose","tensor":"h ∈ R^{T×J×3}","chars":"Every joint of each hand, tracked by on-device SLAM plus calibrated cameras rather than estimated post hoc."}]},"training":{"supervision":"Paired video and hand pose, captured simultaneously.","note":"Native pose annotation is the difference from Ego4D — no downstream hand estimator in the loop, so the labels do not inherit its errors."}},"method":{"intuition":"Dexterous manipulation has no internet-scale corpus, and the cheapest way to make one is to record the hands with hardware that already tracks them.","family":["dataset","imitation"],"backbone":"","init":"","components":["829 h of paired video and 3D hand tracking","194 tabletop tasks","hand trajectory prediction benchmark and metrics"]},"experiments":{"datasets":[{"name":"EgoDex","role":"new"}],"metrics":["hand trajectory prediction error"],"baselines":["imitation learning policies trained on the dataset"],"headline":"The largest and most diverse dexterous human manipulation dataset to date, with a systematic evaluation of trajectory-prediction policies on it."},"why":"The clearest example of the human-video-as-robot-data bet, and the one with the fewest annotation caveats.","confidence":"high","tags":["egocentric","dexterous","dataset","hand pose"],"_src":"10-guidance-skill-fabrication.json"},{"id":"web2grasp","short":"Web2Grasp","title":"Web2Grasp: Learning Functional Grasps from Web Images of Hand-Object Interactions","year":2025,"date":"2025-05","venue":"arXiv","venue_type":"preprint","authors":["Hongyi Chen","Yunchao Yao","Yufei Ye","Zhixuan Xu","Homanga Bharadhwaj","Jiashun Wang"],"n_authors":11,"institutions":[],"links":{"arxiv":"https://arxiv.org/abs/2505.05517"},"tldr":"Photographs of people holding things already encode how to hold them for use, which is the half a power grasp misses. Reconstruct those grasps in 3D, filter by physics, and train a hand on the survivors.","contribution":["method"],"openness":["none"],"arc":["change"],"closes_loop":false,"loop_stage":["represent","decide","act"],"human_role":["demonstrator"],"embodiment":["robot"],"world_facet":["interaction","agent-body","object-state"],"representation":["geometry","trajectory"],"change_channel":["motor-action"],"sensing":["web-video","sim-render"],"regime":"offline","horizon":"seconds","domain":["everyday","web"],"autonomy":"autonomous","problem":{"task":"Functional multi-finger grasping of everyday objects, learned without in-domain demonstrations.","inference":{"inputs":[{"name":"object","modality":"mesh","tensor":"O","chars":"Including unseen and awkward ones — syringe, spray bottle, knife, tongs."}],"outputs":[{"name":"hand configuration","modality":"hand-pose","tensor":"q ∈ R^{d}","chars":"A grasp that supports use, not only holding."}]},"training":{"supervision":"3D hand-object meshes reconstructed from web RGB images by a pretrained model, then filtered.","note":"Two filters make the noisy data usable: geometric feasibility, then physical simulation under disturbance."}},"method":{"intuition":"Power grasps are easy and useless. Functional grasps are what people photograph themselves doing, so mine those.","family":["diffusion","imitation"],"backbone":"interaction-centric grasp model","init":"scratch","components":["3D HOI reconstruction from web images","interaction-centric grasp representation","geometric filtering","physics-based disturbance filtering"]},"experiments":{"datasets":[{"name":"web HOI images"," d against a purpose-built alignment protocol."}]},"training":{"supervision":"Instructional datasets — HTStep, CaptainCook4D, WikiAll.","note":"A pairwise discourse-coherence model enforces consistency between consecutive steps rather than per-image quality."}},"method":{"intuition":"The failure in text-to-image for instructions is discourse, not rendering, so model the linguistic structure of the procedure explicitly.","family":["diffusion","llm"],"backbone":"text-conditioned diffusion","init":"finetune","components":["constituency-parser text encoding","pairwise discourse coherence model","procedural language-to-image alignment protocol"]},"experiments":{"datasets":[{"name":"HTStep","role":"existing"},{"name":"CaptainCook4D","role":"existing"},{"name":"WikiAll","role":"existing"}],"metrics":["language-to-image alignment","sequence coherence"],"baselines":["text-to-image generation without discourse structure"],"headline":"Outperforms existing baselines on all three instructional datasets for content accuracy and sequential consistency."},"why":"The generation side of visual guidance, with the evaluation problem taken seriously rather than eyeballed.","confidence":"high","tags":["visual guidance","instructions","diffusion"],"_src":"10-guidance-skill-fabrication.json"},{"id":"pdc-humanoid","short":"PDC","title":"Emergent Active Perception and Dexterity of Simulated Humanoids from Visual Reinforcement Learning","year":2025,"date":"2025-05","venue":"arXiv","venue_type":"preprint","authors":["Zhengyi Luo","Chen Tessler","Toru Lin","Ye Yuan","Tairan He","Wenli Xiao"],"n_authors":11,"institutions":["NVIDIA","CMU"],"links":{"arxiv":"https://arxiv.org/abs/2505.12278","page":"https://zhengyiluo.github.io/PDC"},"tldr":"Take away privileged object positions and give a humanoid only its own eyes, and searching for things emerges by itself.","contribution":["method"],"openness":["none"],"arc":["change"],"closes_loop":true,"loop_stage":["sense","decide","act"],"human_role":["none rs":["Kumar Ashutosh","Santhosh Kumar Ramakrishnan","Triantafyllos Afouras","Kristen Grauman"],"n_authors":4,"institutions":["UT Austin","Meta AI"],"links":{"arxiv":"https://arxiv.org/abs/2307.08763"},"tldr":"Mine how people actually order steps across thousands of how-to videos, then use that distribution to regularize keystep recognition in a new video.","contribution":["method"],"openness":["none"],"arc":["model"],"closes_loop":false,"loop_stage":["represent"],"embodiment":["none"],"human_role":["observed"],"world_facet":["procedure"],"representation":["graph","language"],"change_channel":["none"],"sensing":["exocentric","web-video"],"regime":"offline","horizon":"minutes","domain":["everyday","web"],"autonomy":"none","problem":{"task":"Zero-shot keystep localization in an unseen instructional video.","inference":{"inputs":[{"name":"video","modality":"video","tensor":"V ∈ R^{T×H×W×3}","chars":"How-to video for a known task."},{"name":"keystep list","modality":"text","tensor":"{k₁..k_K}","chars":"From a task vocabulary; the ordering is not given."}],"outputs":[{"name":"keystep assignment","modality":"label","tensor":"y_{1:T}","chars":"Per-segment, regularized by the mined graph."}]},"training":{"supervision":"The graph is mined from unlabeled how-to video corpora. Recognition itself stays zero-shot.","note":"Probabilistic ordering, not a rigid script — that flexibility is the difference from earlier procedure-alignment work."}},"method":{"intuition":"People do not follow recipes in a fixed order, so a script is the wrong prior and a distribution over orderings is the right one.","family":["graph"],"backbone":"video-language features + graph decoding","init":"frozen-foundation","components":["automatic task graph discovery from how-to video","graph-regularized keystep decoding"]},"experiments":{"datasets":[{"name":"HowTo100M-derived corpora","role":"existing"},{"name":"CrossTask, COIN, Ego4D Goal-Step","role":"existing"}],"metrics":["keystep localization accuracy","representation quality"],"baselines":["script-based alignment","unstructured keystep recognition"],"headline":"More reliable zero-shot keystep localization and better video representations than prior work across multiple instructional datasets."},"why":"Establishes the probabilistic-ordering view of procedure that the differentiable and online-mistake work later builds on.","confidence":"high","tags":["task graph","procedure","zero-shot"],"_src":"04-procedure-structure.json"},{"id":"every-mistake-counts","short":"Every Mistake Counts","title":"Every Mistake Counts in Assembly","year":2023,"date":"2023-07","venue":"arXiv","venue_type":"preprint","authors":["Guodong Ding","Fadime Sener","Shugao Ma","Angela Yao"],"n_authors":4,"institutions":["National University of Singapore","Meta Reality Labs"],"links":{"arxiv":"https://arxiv.org/abs/2307.16453"},"tldr":"Build the constraint set from the mistakes you have already watched: spatial beliefs about how parts fit, temporal beliefs about what must come first, updated online.","contribution":["method","dataset"],"openness":["data"],"arc":["model","change"],"closes_loop":true,"loop_stage":["represent","verify","adapt"],"embodiment":["human"],"human_role":["assisted"],"world_facet":["procedure","object-state"],"representation":["graph"],"change_channel":["alert"],"sensing":["egocentric","exocentric"],"regime":"streaming","horizon":"minutes","domain":["everyday","industrial"],"autonomy":"autonomous","problem":{"task":"Identify ordering mistakes in an assembly sequence, online.","inference":{"inputs":[{"name":"action sequence","modality":"label","tensor":"(a₁..a_t)","chars":"Observed so far, real-world and noisy."}],"outputs":[{"name":"ordering violation","modality":"label","tensor":"m_t ∈ {0,1}","chars":"Checked against the current belief sets."}]},"training":{"supervision":"Beliefs are accumulated from observed mistakes rather than fit offline.","note":"Episodic memory means the knowledge base grows during deployment — a rare instance of the adapt stage actually being implemented."}},"method":{"intuition":"You cannot enumerate every wrong ordering in advance, but you can accumulate the constraints that the wrong ones violate.","family":["graph","classical"],"backbone":"belief-set knowledge base with episodic memory","init":"scratch","components":["spatial beliefs over part topology","temporal beliefs over prerequisites","online belief update","new coarse part-position annotations for Assembly101"]},"experiments":{"datasets":[{"name":"Assembly101","role":"reannotated"}],"metrics":["ordering mistake detection accuracy"],"baselines":["sequence models without an explicit knowledge base"],"headline":"Inferred spatial and temporal beliefs identify incorrect orderings in real action sequences, outperforming the compared inference algorithms on Assembly101."},"why":"The clearest statement that a task assistant should keep learning its constraints while it watches, during deployment.","confidence":"high","tags":["mistakes","knowledge base","online"],"_src":"04-procedure-structure.json"},{"id":"voxposer","short":"VoxPoser","title":"VoxPoser: Composable 3D Value Maps for Robotic Manipulation with Language Models","year":2023,"date":"2023-07","venue":"CoRL 2023","venue_type":"conference","authors":["Wenlong Huang","Chen Wang","Ruohan Zhang","Yunzhu Li","Jiajun Wu","Li Fei-Fei"],"n_authors":6,"institutions":["Stanford University"],"links":{"arxiv":"https://arxiv.org/abs/2307.05973","page":"https://voxposer.github.io"},"tldr":"Have the LLM write code that paints affordance and constraint into a 3D voxel grid, then plan a dense trajectory through it — no motion primitives.","contribution":["method"],"openness":["code"],"arc":["model","change"],"closes_loop":true,"loop_stage":["represent","decide","act","adapt"],"embodiment":["robot"],"human_role":["none"],"world_facet":["scene","object-state","interaction"],"representation":["geometry","program","language"],"change_channel":["plan","motor-action"],"sensing":["robot-onboard","depth-3d"],"regime":"interactive","horizon":"seconds","domain":["lab-sim","everyday"],"autonomy":"autonomous","problem":{"task":"Zero-shot synthesis of dense 6-DoF end-effector trajectories from open-set language over open-set objects.","inference":{"inputs":[{"name":"instruction","modality":"text","tensor":"ℓ","chars":"Free-form, open vocabulary."},{"name":"RGB-D observation","modality":"rgbd","tensor":"I ∈ R^{H×W×4}","chars":"Grounded through a VLM into the voxel grid."}],"outputs":[{"name":"6-DoF waypoint sequence","modality":"trajectory","tensor":"τ ∈ SE(3)^K","chars":"Dense, replanned under perturbation."}]},"training":{"supervision":"None for the base system. An optional online dynamics model is fit from experience for contact-rich scenes.","note":"The value map is the interface: language decides what it contains, planning consumes it."}},"method":{"intuition":"LLMs can name affordances and constraints but not act on them. Writing them into a 3D field turns semantics into an objective a planner can optimize.","family":["llm","classical"],"backbone":"LLM code generation + VLM grounding + model-based planner","init":"prompt-only","components":["composable 3D value maps","LLM-written value map code","VLM grounding","closed-loop MPC","online dynamics learning"]},"experiments":{"datasets":[{"name":"simulated and real everyday manipulation tasks","role":"real-robot"}],"metrics":["zero-shot task success","robustness to dynamic perturbation"],"baselines":["primitive-based LLM planners"],"headline":"A large study across simulation and real robots on open-set instructions and objects, with trajectories that hold up under perturbation during execution."},"why":"The clearest bridge between the modeling arc and the change arc: the world representation is literally the planning objective.","confidence":"high","tags":["LLM","3D","manipulation","zero-shot"],"_src":"07-robot-embodiment.json"},{"id":"rt-2","short":"RT-2","title":"RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control","year":2023,"date":"2023-07","venue":"CoRL 2023","venue_type":"conference","authors":["Anthony Brohan","Noah Brown","Justice Carbajal","Yevgen Chebotar","Xi Chen","Karol Hausman"],"n_authors":54,"institutions":["Google DeepMind"],"links":{"arxiv":"https://arxiv.org/abs/2307.15818","page":"https://robotics-transformer.github.io/"},"tldr":"Write actions as text tokens and co-train a VLM on robot trajectories and web VQA, and web semantics leak into the gripper.","contribution":["method"],"openness":["none"],"arc":["change"],"closes_loop":true,"loop_stage":["sense","decide","act"],"embodiment":["robot"],"human_role":["demonstrator"],"world_facet":["object-state","procedure"],"representation":["tokens","language"],"change_channel":["motor-action"],"sensing":["robot-onboard"],"regime":"streaming","horizon":"seconds","domain":["everyday","lab-sim"],"autonomy":"autonomous","problem":{"task":"End-to-end language-conditioned manipulation from a vision-language backbone.","inference":{"inputs":[{"name":"image","modality":"image","tensor":"o_t ∈ R^{H×W×3}","chars":"Single robot camera."},{"name":"instruction","modality":"text","tensor":"ℓ","chars":"May reference concepts absent from all robot data."}],"outputs":[{"name":"action tokens","modality":"tokens","tensor":"a_t discretized into text tokens","chars":"7-DoF end-effector delta plus gripper, emitted as a string."}]},"training":{"supervision":"Co-fine-tuning on robot trajectories and internet-scale vision-language tasks, in one token stream.","note":"The recipe is the contribution: one format for both data sources means no architectural bridge is needed."}},"method":{"intuition":"If actions are text, then robot control is just another vision-language task, and web pretraining stops being a separate stage.","family":["vlm","transformer"],"backbone":"PaLI-X / PaLM-E","init":"finetune","components":["action-as-text tokenization","co-fine-tuning on web and robot data","cha
